# Same model as AA-Booking, AA-CIS-App and AA-CIS-Infra (AA-895, S243).
# - pip (/api) and npm (/web, AA-935; /portal went with AA-1036): security updates only, one grouped PR per week per ecosystem.
#   Version updates are off (open-pull-requests-limit: 0); the weekly schedule only paces the group.
# - github-actions: weekly version updates, grouped into one PR (pinned action versions are a supply-chain
#   control; Infra does the same).
# Alerts and security updates are switched on in the repo settings. Triage and SLA: AA-Ecosys
# docs/security/vulnerability-management.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  # AA-1164: the Node base image of web/Dockerfile is pinned by tag and digest; Dependabot moves both weekly,
  # Node 22 patch and minor only (a major version is a deliberate change), one PR at a time. Like the PRs above, it
  # gets no repository secrets; the deploy that follows its merge rebuilds and redeploys the image.
  - package-ecosystem: docker
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      base-image:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    # "/" reads .github/workflows; the composite actions in .github/actions/<name>/action.yml are read too (AA-1024)
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
