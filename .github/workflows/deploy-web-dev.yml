name: Deploy Web Dev

# AA-935 (CRM-07) — the CRM web (web/, Next.js standalone) to ECS Dev. Same model as Deploy Dev (the API): build on a
# native arm64 runner -> push to ECR with the immutable git-SHA tag -> new task definition revision copied from the
# family's LATEST revision with only the image swapped -> update the service -> wait stable -> post-deploy verify.
# Runtime resources come from AA-CIS-Infra accounts/aa365/crm_web.tf; the OIDC role is the same
# deploy role as the API (aa-crm-dev-app-deploy; crm_web.tf extends its policy to the web repository, family and
# service).
#
# No job guard: the web runs no crm.job worker, so a deploy interrupts no job (the API deploy keeps its guard).
#
# Configuration (GitHub environment `dev`, VARIABLES, none secret):
#   AWS_ROLE_ARN          the deploy role (shared with Deploy Dev)
#   CRM_WEB_ENABLED       "true" once crm_web.tf is applied; otherwise the run is red (config fails, AA-993)
#   AWS_REGION            default us-west-1
#   ECR_WEB_REPOSITORY    default aa-crm-dev-web
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_WEB_SERVICE       default aa-crm-dev-web
#   ECS_WEB_TASK_FAMILY   default aa-crm-dev-web
#   CRM_WEB_BASE_URL      default https://portal.lumiguides.it.com (the agency host: CloudFront -> ALB agency default
#                         rule -> web; AA-979 §4.5: partner-dev. answers 301 there except /crm/*; read by the verify
#                         and the studio smoke)
#   WEB_PUBLIC_SENTRY_DSN the browser Sentry DSN (public by design, AA-1036: the studio's browser Sentry moved here),
#                         baked in at build time; empty = off
#
# Pushes that only change web/tests/** do not deploy. This workflow never changes the desired count.
#
# Post-deploy verify (AA-993 V3, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml with app crm-web (also
# dispatchable with expected_sha; rows .github/verify/crm-web.rows, plus .github/scripts/edge_verify.sh): ECS rollout
# COMPLETED with desired >= 1 on the built image, /healthz on this commit and version with sign-in configured, the
# signed-out redirect to /auth/refresh, and /crm/health + /crm/health/ready reaching a ready API through the host's
# API rule. The `result` job ("Deploy Web Dev result") is red when any job did not succeed, skipped included: read
# that one. Desired count 0 is red (scaling Dev up is a separate step).
#
# AA-1036 (R3 slice 2, root ADR 0019 d6): the Content studio is part of this app and the agency host's studio paths
# (/portal*, /api/*, /tenant-login*, /terms, /privacy, /assets/*) reach it, so the verify also checks the studio
# (crm-web.rows studio-healthz; edge_verify.sh content-home, studio-signin, api-key-signin-off, studio-legal,
# studio-page, web-assets) and `smoke` runs the studio's Playwright smoke (ui-smoke-portal.yml) on the agency host
# with the e2e studio user's sign-in required, as the retired Deploy Portal Dev did.
# AA-1119: a red `verify` or `smoke` after a successful deploy rolls the service back to the revision it ran
# before this deploy (`rollback`, refused when that revision is unknown or unsafe) and opens or comments on the
# deploy-smoke-red issue (`report`); the next verified deploy closes it. The run stays red.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/tests/**"
      - ".github/workflows/deploy-web-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # AA-993: red, not a skip. It used to output enabled=false and skip every job, which GitHub shows green.
      - name: Check AWS_ROLE_ARN and CRM_WEB_ENABLED
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          WEB_ENABLED: ${{ vars.CRM_WEB_ENABLED }}
        run: |
          if [ -z "${ROLE_ARN}" ] || [ "${WEB_ENABLED}" != "true" ]; then
            echo "::error::AWS_ROLE_ARN unset or CRM_WEB_ENABLED != true on environment 'dev': nothing can be deployed or verified (AA-CIS-Infra crm_web.tf outputs)."
            exit 1
          fi

  deploy:
    name: Deploy web to ECS Dev
    needs: config
    runs-on: ubuntu-24.04-arm
    environment: dev
    # The `dev` environment variable the smoke call needs (a job that calls a reusable workflow cannot read it).
    outputs:
      base_url: ${{ vars.CRM_WEB_BASE_URL || 'https://portal.lumiguides.it.com' }}
      # AA-1119: the revision the service ran before this deploy (empty = unknown or unsafe: never rolled back).
      previous_td: ${{ steps.before.outputs.previous_td }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY || 'aa-crm-dev-web' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'aa-crm-dev-web' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_WEB_TASK_FAMILY || 'aa-crm-dev-web' }}
      PUBLIC_SENTRY_DSN: ${{ vars.WEB_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # IMMUTABLE repository: a re-deploy of the same commit reuses the image already pushed for this SHA.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" \
              --build-arg NEXT_PUBLIC_SENTRY_DSN="${PUBLIC_SENTRY_DSN}" -t "$IMAGE" web
            docker image inspect "$IMAGE" --format '{{.Architecture}}' | grep -qx arm64
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      # AA-1119 (S282 audit R32): record what runs now, before update-service, so a red post-deploy check can roll
      # back to it. Empty when the service is not settled or runs a Terraform template revision (then `rollback`
      # never acts).
      - name: Record the revision before this deploy (rollback target)
        id: before
        run: |
          set -euo pipefail
          python3 .github/scripts/ecs_smoke_rollback.py previous --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" >> "$GITHUB_OUTPUT"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          # family:revision only: the full ARN names the AWS account (public logs).
          echo "base task definition: $(jq -r '.taskDefinitionArn | split("/") | last' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: ${NEW_TD##*/}"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # AA-993 V3 (ADR 0016 D3) — the post-deploy checks (running image, desired count, /healthz, the sign-in redirect,
  # the API rule) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when `deploy`
  # succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
      app: crm-web

  # AA-1036: the Playwright smoke of the Content studio (now served by this app) on the agency host, logged-in pages
  # included: require_tenant_login turns a missing studio sign-in red. Only the e2e studio user's three secrets are
  # passed, never `inherit`.
  smoke:
    name: Studio UI smoke
    needs: [deploy, verify]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ui-smoke-portal.yml
    with:
      base_url: ${{ needs.deploy.outputs.base_url }}
      sha: ${{ github.sha }}
      require_tenant_login: true
    secrets:
      E2EPORTALEMAIL: ${{ secrets.E2EPORTALEMAIL }}
      E2EPORTALPASSWORD: ${{ secrets.E2EPORTALPASSWORD }}
      E2EPORTALTOTP: ${{ secrets.E2EPORTALTOTP }}

  # AA-1119 (S282 audit R32): a red post-deploy check must not leave the bad build serving. When `verify` or `smoke`
  # failed after a successful deploy, move the service back to the revision recorded before the deploy
  # (.github/scripts/ecs_smoke_rollback.py, the unattended form of root runbook docs/ops/runbooks/rollback-ecs.md). It
  # refuses, changing nothing, when that revision is unknown or unsafe (template revision, image gone from ECR, a
  # deployment in progress, the service moved since). The run stays red either way (`result`); `report` opens the
  # issue. Visual is report-only and never triggers it. Fix forward on main; the next deploy registers a fresh revision.
  rollback:
    name: Roll back after a red post-deploy check
    needs: [deploy, verify, smoke]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.deploy.result == 'success'
      && (needs.verify.result == 'failure' || needs.smoke.result == 'failure')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY || 'aa-crm-dev-web' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'aa-crm-dev-web' }}
    outputs:
      outcome: ${{ steps.rollback.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Roll back to the revision before this deploy
        id: rollback
        env:
          PREVIOUS_TD: ${{ needs.deploy.outputs.previous_td }}
        run: |
          set -uo pipefail
          python3 .github/scripts/ecs_smoke_rollback.py rollback --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --repository "$ECR_REPOSITORY" --previous "$PREVIOUS_TD" \
            --deployed-tag "$GITHUB_SHA" --apply 2> /tmp/rollback.log
          status=$?
          cat /tmp/rollback.log
          case "$status" in
            0) outcome="rolled back to ${PREVIOUS_TD}" ;;
            3) outcome="not rolled back (refused: $(grep -m1 '^REFUSED' /tmp/rollback.log | cut -c1-200))" ;;
            *) outcome="rollback FAILED (exit $status)" ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "- $outcome" >> "$GITHUB_STEP_SUMMARY"
          # Refused is a safe outcome (nothing changed); a failed rollback is red.
          [ "$status" = 0 ] || [ "$status" = 3 ]

  # AA-1119: one open issue labelled deploy-smoke-red per workflow while its post-deploy checks are red on main (opened,
  # then commented on), closed by the next verified deploy. Same pattern as AA-CIS-App's nightly-red issue. Only this
  # job writes, and only issues; no checkout.
  report:
    name: Report a red post-deploy check (issue)
    needs: [deploy, verify, smoke, rollback]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Deploy Web Dev: post-deploy check is red"
      VERIFY: ${{ needs.verify.result }}
      SMOKE: ${{ needs.smoke.result }}
      OUTCOME: ${{ needs.rollback.outputs.outcome || needs.rollback.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, comment on or close the deploy-smoke-red issue
        run: |
          set -euo pipefail
          N=$(gh issue list --label deploy-smoke-red --state open --limit 50 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ "$VERIFY" = "success" ] && [ "$SMOKE" = "success" ]; then
            if [ -n "$N" ]; then
              gh issue close "$N" --comment "Verified again on ${GITHUB_SHA::7}: $RUN_URL"
              echo "- post-deploy checks green: closed #$N" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          BODY="Deploy Web Dev on \`${GITHUB_SHA::7}\`: verify **$VERIFY**, smoke **$SMOKE**. Rollback: ${OUTCOME:-not run}.
          Run: $RUN_URL

          Read the failed job first. A rollback leaves main ahead of what runs: fix forward (revert or fix on main).
          Runbook: docs/ops/runbooks/rollback-ecs.md in the root repo. The next verified deploy closes this issue."
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
          else
            gh label create deploy-smoke-red --color B60205 --force \
              --description "A post-deploy verify or smoke is red on main (deploy workflows, AA-1119)"
            N=$(gh issue create --title "$TITLE" --label deploy-smoke-red --body "$BODY" | sed -nE 's#.*/issues/([0-9]+)$#\1#p')
          fi
          echo "::warning::post-deploy check red: issue #$N (label deploy-smoke-red)"
          echo "- post-deploy check red: issue #$N (label deploy-smoke-red)" >> "$GITHUB_STEP_SUMMARY"

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed config/deploy
  # (verify then skips) could look like "nothing to verify". Every job here must succeed; skipped, failed or
  # cancelled is red on every event (no job it waits on is conditional; `rollback` and `report` (AA-1119) are, and
  # `result` does not wait on them).
  result:
    name: Deploy Web Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [config, deploy, verify, smoke]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 4 ]; then
            echo "::error::Deploy Web Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Web Dev ($EVENT): deployed, verified and smoke-tested."
