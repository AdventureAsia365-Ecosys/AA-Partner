name: Deploy Web Dev

# AA-935 (CRM-07) — the CRM web (web/, Next.js standalone) to ECS Dev. Same model as Deploy Dev (the API): build on a
# native arm64 runner -> push to ECR with the immutable git-SHA tag -> new task definition revision copied from the
# family's LATEST revision with only the image swapped -> update the service -> wait stable -> post-deploy verify.
# Runtime resources come from AA-CIS-Infra accounts/aa365/crm_web.tf; the OIDC role is the same
# deploy role as the API (aa-crm-dev-app-deploy; crm_web.tf extends its policy to the web repository, family and
# service).
#
# No job guard: the web runs no crm.job worker, so a deploy interrupts no job (the API deploy keeps its guard).
#
# Configuration (GitHub environment `dev`, VARIABLES, none secret):
#   AWS_ROLE_ARN          the deploy role (shared with Deploy Dev)
#   CRM_WEB_ENABLED       "true" once crm_web.tf is applied; otherwise the run is red (config fails, AA-993)
#   AWS_REGION            default us-west-1
#   ECR_WEB_REPOSITORY    default aa-crm-dev-web
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_WEB_SERVICE       default aa-crm-dev-web
#   ECS_WEB_TASK_FAMILY   default aa-crm-dev-web
#   CRM_WEB_BASE_URL      default https://portal.lumiguides.it.com (the agency host: CloudFront -> ALB agency default
#                         rule -> web; AA-979 §4.5: partner-dev. answers 301 there except /crm/*; read by the verify)
#
# Pushes that only change web/tests/** do not deploy. This workflow never changes the desired count.
#
# Post-deploy verify (AA-993 V3, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml with app crm-web (also
# dispatchable with expected_sha; rows .github/verify/crm-web.rows, plus .github/scripts/edge_verify.sh): ECS rollout
# COMPLETED with desired >= 1 on the built image, /healthz on this commit and version with sign-in configured, the
# signed-out redirect to /auth/refresh, and /crm/health + /crm/health/ready reaching a ready API through the host's
# API rule. The `result` job ("Deploy Web Dev result") is red when any job did not succeed, skipped included: read
# that one. Desired count 0 is red (scaling Dev up is a separate step).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/tests/**"
      - ".github/workflows/deploy-web-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # AA-993: red, not a skip. It used to output enabled=false and skip every job, which GitHub shows green.
      - name: Check AWS_ROLE_ARN and CRM_WEB_ENABLED
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          WEB_ENABLED: ${{ vars.CRM_WEB_ENABLED }}
        run: |
          if [ -z "${ROLE_ARN}" ] || [ "${WEB_ENABLED}" != "true" ]; then
            echo "::error::AWS_ROLE_ARN unset or CRM_WEB_ENABLED != true on environment 'dev': nothing can be deployed or verified (AA-CIS-Infra crm_web.tf outputs)."
            exit 1
          fi

  deploy:
    name: Deploy web to ECS Dev
    needs: config
    runs-on: ubuntu-24.04-arm
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY || 'aa-crm-dev-web' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'aa-crm-dev-web' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_WEB_TASK_FAMILY || 'aa-crm-dev-web' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # IMMUTABLE repository: a re-deploy of the same commit reuses the image already pushed for this SHA.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" -t "$IMAGE" web
            docker image inspect "$IMAGE" --format '{{.Architecture}}' | grep -qx arm64
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          # family:revision only: the full ARN names the AWS account (public logs).
          echo "base task definition: $(jq -r '.taskDefinitionArn | split("/") | last' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: ${NEW_TD##*/}"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # AA-993 V3 (ADR 0016 D3) — the post-deploy checks (running image, desired count, /healthz, the sign-in redirect,
  # the API rule) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when `deploy`
  # succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
      app: crm-web

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed config/deploy
  # (verify then skips) could look like "nothing to verify". Every job here must succeed; skipped, failed or
  # cancelled is red on every event (no job in this workflow is conditional).
  result:
    name: Deploy Web Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [config, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 3 ]; then
            echo "::error::Deploy Web Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Web Dev ($EVENT): deployed and verified."
