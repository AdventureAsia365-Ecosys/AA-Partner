name: Deploy Web Dev

# AA-935 (CRM-07) — the CRM web (web/, Next.js standalone) to ECS Dev. Same model as Deploy Dev (the API): build on a
# native arm64 runner -> push to ECR with the immutable git-SHA tag -> new task definition revision copied from the
# family's LATEST revision with only the image swapped -> update the service -> wait stable -> verify the running
# image -> live smoke. Runtime resources come from AA-CIS-Infra accounts/aa365/crm_web.tf; the OIDC role is the same
# deploy role as the API (aa-crm-dev-app-deploy; crm_web.tf extends its policy to the web repository, family and
# service).
#
# No job guard: the web runs no crm.job worker, so a deploy interrupts no job (the API deploy keeps its guard).
#
# Configuration (GitHub environment `dev`, VARIABLES, none secret):
#   AWS_ROLE_ARN          the deploy role (shared with Deploy Dev)
#   CRM_WEB_ENABLED       "true" once crm_web.tf is applied; otherwise the deploy is skipped with a warning
#   AWS_REGION            default us-west-1
#   ECR_WEB_REPOSITORY    default aa-crm-dev-web
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_WEB_SERVICE       default aa-crm-dev-web
#   ECS_WEB_TASK_FAMILY   default aa-crm-dev-web
#   CRM_WEB_BASE_URL      default https://partner-dev.lumiguides.it.com (CloudFront -> ALB partner default rule -> web)
#
# Pushes that only change web/tests/** do not deploy. This workflow never changes the desired count.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/tests/**"
      - ".github/workflows/deploy-web-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check AWS_ROLE_ARN and CRM_WEB_ENABLED
        id: check
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          WEB_ENABLED: ${{ vars.CRM_WEB_ENABLED }}
        run: |
          if [ -z "${ROLE_ARN}" ] || [ "${WEB_ENABLED}" != "true" ]; then
            echo "::warning::AWS_ROLE_ARN unset or CRM_WEB_ENABLED != true on environment 'dev' — web deploy skipped (AA-CIS-Infra crm_web.tf not applied yet?)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy web to ECS Dev
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-24.04-arm
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY || 'aa-crm-dev-web' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'aa-crm-dev-web' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_WEB_TASK_FAMILY || 'aa-crm-dev-web' }}
      BASE_URL: ${{ vars.CRM_WEB_BASE_URL || 'https://partner-dev.lumiguides.it.com' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # IMMUTABLE repository: a re-deploy of the same commit reuses the image already pushed for this SHA.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" -t "$IMAGE" web
            docker image inspect "$IMAGE" --format '{{.Architecture}}' | grep -qx arm64
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          echo "base task definition: $(jq -r '.taskDefinitionArn' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: $NEW_TD"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify the running image
        run: |
          set -euo pipefail
          TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          RUNNING=$(aws ecs describe-task-definition --task-definition "$TD" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "service image: $RUNNING"
          [ "$RUNNING" = "$DEPLOY_IMAGE" ] || { echo "::error::service runs $RUNNING, expected $DEPLOY_IMAGE"; exit 1; }
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' --output text)
          echo "DESIRED_COUNT=$DESIRED" >> "$GITHUB_ENV"

      - name: Smoke test (/healthz, sign-in redirect, unknown path)
        run: |
          set -uo pipefail
          if [ "${DESIRED_COUNT}" = "0" ]; then
            echo "::warning::desired count is 0 — no task is running, smoke skipped (scale to 1 is a separate step)."
            exit 0
          fi
          BASE="${BASE_URL%/}"
          fail=0
          code=$(curl -s --max-time 20 -o /tmp/healthz.json -w "%{http_code}" "$BASE/healthz")
          cat /tmp/healthz.json; echo
          if [ "$code" != "200" ] || ! jq -e --arg sha "$GITHUB_SHA" --arg ver "$APP_VERSION" \
            '.status == "ok" and .service == "aa-crm-web" and .git_sha == $sha and .version == $ver and .auth_configured == true' /tmp/healthz.json >/dev/null; then
            echo "::error::/healthz -> $code (expected 200, git_sha $GITHUB_SHA, version $APP_VERSION, auth configured)"; fail=1
          fi
          loc=$(curl -s --max-time 20 -o /dev/null -w "%{redirect_url}" "$BASE/pipeline")
          case "$loc" in
            "$BASE/auth/refresh?next=%2Fpipeline") ;;
            *) echo "::error::/pipeline without a session redirected to '$loc'"; fail=1 ;;
          esac
          # /crm/* must still reach the API rule, never the web default (without a session the web would answer 307 to
          # /auth/refresh). 200 is the API up; 503 is the API at desired 0 (no healthy target), not this deploy's concern.
          code=$(curl -s --max-time 20 -o /tmp/crm.json -w "%{http_code}" "$BASE/crm/health")
          if [ "$code" = "200" ]; then
            jq -e '.service == "aa-crm-api"' /tmp/crm.json >/dev/null || { echo "::error::/crm/health is not the API"; fail=1; }
          elif [ "$code" != "503" ]; then
            echo "::error::/crm/health -> $code: the API rule must stay above the web default"; fail=1
          fi
          [ "$fail" = "0" ] && echo "Smoke passed" || exit 1
