name: UI Smoke (portal)

# AA-979 (CRM-P2a) — the Playwright smoke of the tenant portal (portal/, Vercel aa-cis-portal), against a portal
# deployment. Port of AA-CIS-App's ui-smoke-portal.yml (AA-885). Called by vercel-deploy-portal.yml after a
# successful preview deploy (workflow_call), or run by hand (workflow_dispatch, e.g. against
# https://portal.lumiguides.it.com). Specs: e2e/smoke-portal/, config e2e/playwright.portal.config.ts.
# Secrets: the portal's bypass secret (VERCEL_PORTAL_BYPASS_SECRET, exported under the name the helpers read) and the
# tenant test key E2E_TENANT_API_KEY (logged-in tests SKIP, not fail, when it is absent). No other credential.
on:
  workflow_call:
    inputs:
      base_url:
        description: "Deployment URL to run the smoke against"
        required: true
        type: string
      sha:
        description: "Commit to check out and to find the PR by (the PR head sha)"
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_PORTAL_BYPASS_SECRET:
        required: false
      E2E_TENANT_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run the smoke against (e.g. a preview or production URL)"
        required: true
        type: string
      sha:
        description: "Optional commit sha to check out and comment on (default: the dispatched ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One run per deployment URL; a re-run on the same URL cancels the in-flight one.
  group: ui-smoke-portal-${{ inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: UI smoke portal (Playwright)
    runs-on: ubuntu-latest
    if: inputs.base_url != ''
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      # Portal previews are behind Vercel SSO: the bypass secret lets Playwright reach them. The helpers read it as
      # VERCEL_AUTOMATION_BYPASS_SECRET and send it only to the BASE_URL origin, and only when present.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_PORTAL_BYPASS_SECRET }}
      # The tenant test account's API key (Secrets Manager aa-cis/dev/e2e-tenant/<slug>, copied by the orchestrator;
      # re-copy after a key rotation). Without it the logged-in portal tests skip.
      E2E_TENANT_API_KEY: ${{ secrets.E2E_TENANT_API_KEY }}
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Exact versions in e2e/package.json; no lockfile on purpose (this folder never ships), no install scripts.
      - name: Install Playwright
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install the browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Run the portal UI smoke
        run: npx playwright test -c playwright.portal.config.ts

      - name: Upload smoke artifacts (screenshots + HTML report only, NO auth state)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-portal-${{ github.run_id }}
          # Never e2e/.auth (session cookies).
          path: |
            e2e/results/smoke-portal/**/*.png
            e2e/results/smoke-portal-report/
          if-no-files-found: warn
          retention-days: 14

      # Find the PR for the deployed sha and post / update ONE comment. All values reach `run:` through env.
      - name: Find PR for the deployed sha
        if: always()
        id: findpr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Found PR: ${PR:-none}"

      - name: Comment smoke result on the PR
        if: always() && steps.findpr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.findpr.outputs.pr }}
          OUTCOME: ${{ job.status }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          MARKER="<!-- ui-smoke-report-portal -->"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ]; then STATUS="✅ passed"; else STATUS="❌ failed"; fi
          BODY=$(printf '%s\n### UI smoke (portal) — %s\n\nPreview: %s\n\n[Run & artifacts (screenshots + HTML report)](%s)\n' \
                   "$MARKER" "$STATUS" "${BASE_URL:-n/a}" "$RUN_URL")
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "Created a new comment"
          fi

      # Scrub the Playwright auth storage state (live session cookies) regardless of outcome.
      - name: Delete auth state
        if: always()
        run: rm -rf .auth
