name: UI Smoke (portal)

# AA-979 (CRM-P2a) — the Playwright smoke of the tenant portal (portal/), against the studio on the agency host. Port of
# AA-CIS-App's ui-smoke-portal.yml (AA-885). Called by deploy-portal-dev.yml after the Fargate deploy and its verify
# (AA-993 V3), or run by hand (workflow_dispatch, e.g. against https://portal.lumiguides.it.com). Specs:
# e2e/smoke-portal/, config e2e/playwright.portal.config.ts. Since the P2b clean-up (runbook §4.5) there is no Vercel
# copy and no preview: the target is always the Fargate studio (PORTAL_TARGET=fargate).
# Secrets: the e2e studio user's partner-pool sign-in (E2EPORTALEMAIL, E2EPORTALPASSWORD, E2EPORTALTOTP: a synthetic
# partner identity with a Content studio membership on the E2E tenant; the setup signs in through managed login with
# the authenticator code, like a person). Without them the logged-in tests SKIP, unless the caller sets
# require_tenant_login (deploy-portal-dev.yml does): then a missing value is red before any test runs.
on:
  workflow_call:
    inputs:
      base_url:
        description: "Deployment URL to run the smoke against"
        required: true
        type: string
      sha:
        description: "Commit to check out and to find the PR by (the PR head sha)"
        required: false
        type: string
        default: ""
      resolve_via:
        description: "A CloudFront name (*.cloudfront.net) the base URL's host is pinned to on the runner (/etc/hosts); empty = DNS"
        required: false
        type: string
        default: ""
      require_tenant_login:
        description: "AA-993 V3: true = a missing studio sign-in secret is red (the logged-in tests must run), not a skip"
        required: false
        type: boolean
        default: false
    secrets:
      E2EPORTALEMAIL:
        required: false
      E2EPORTALPASSWORD:
        required: false
      E2EPORTALTOTP:
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run the smoke against (e.g. a preview or production URL)"
        required: true
        type: string
      sha:
        description: "Optional commit sha to check out and comment on (default: the dispatched ref)"
        required: false
        type: string
        default: ""
      resolve_via:
        description: "AA-979 pre-cutover: a CloudFront name (*.cloudfront.net) the base URL's host is pinned to on the runner (/etc/hosts); empty = DNS"
        required: false
        type: string
        default: ""
      require_tenant_login:
        description: "AA-993 V3: red when a studio sign-in secret is missing (otherwise the logged-in tests skip)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One run per caller and deployment URL; a re-run on the same URL cancels the in-flight one. The caller's name
  # (github.workflow is the caller's in a workflow_call) keeps a hand-dispatched smoke from cancelling the smoke of a
  # Deploy Portal Dev run (that would turn the deploy red).
  group: ui-smoke-portal-${{ github.workflow }}-${{ inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: UI smoke portal (Playwright)
    # Pinned (S252, 26/10/2026): ubuntu-latest moved to 26.04 and Playwright does not support Chromium there yet.
    runs-on: ubuntu-24.04
    if: inputs.base_url != ''
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url }}
      PORTAL_TARGET: fargate
    steps:
      # AA-979: when the agency host must be pinned to its distribution (CRM_AGENCY_CF_DOMAIN set on the caller), pin it
      # to that CloudFront distribution for this run only (Playwright's browser and its request API both
      # read /etc/hosts).
      - name: Pin the base URL's host to the CloudFront distribution (optional)
        if: inputs.resolve_via != ''
        working-directory: .
        env:
          VIA: ${{ inputs.resolve_via }}
        run: |
          set -euo pipefail
          [[ "$VIA" =~ ^[a-z0-9]+\.cloudfront\.net$ ]] || { echo "::error::resolve_via must be a *.cloudfront.net name"; exit 1; }
          HOST=$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlsplit(os.environ["BASE_URL"]).hostname)')
          IP=$(getent ahostsv4 "$VIA" | awk 'NR==1{print $1}')
          [ -n "$IP" ] || { echo "::error::cannot resolve $VIA"; exit 1; }
          echo "$IP $HOST" | sudo tee -a /etc/hosts
          getent hosts "$HOST"

      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Exact versions in e2e/package.json; no lockfile on purpose (this folder never ships), no install scripts.
      - name: Install Playwright
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install the browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      # The secrets live on this step only (not the job): npm install, the browser install and tsc never see them.
      - name: Run the portal UI smoke
        env:
          # The e2e studio user's partner-pool sign-in (repository secrets, copied by the orchestrator from the user's
          # Secrets Manager entry; re-copy after a password or authenticator reset). Without them the logged-in portal
          # tests skip, or, with require_tenant_login, this step is red.
          E2EPORTALEMAIL: ${{ secrets.E2EPORTALEMAIL }}
          E2EPORTALPASSWORD: ${{ secrets.E2EPORTALPASSWORD }}
          E2EPORTALTOTP: ${{ secrets.E2EPORTALTOTP }}
          REQUIRETENANTLOGIN: ${{ inputs.require_tenant_login && 'true' || 'false' }}
        run: |
          # AA-993 V3: a caller that needs the logged-in pages proven (the Fargate deploy) gets red, not skipped tests.
          if [ "$REQUIRETENANTLOGIN" = "true" ]; then
            for name in E2EPORTALEMAIL E2EPORTALPASSWORD E2EPORTALTOTP; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not set (repository secret: the e2e studio user's partner sign-in): the logged-in portal smoke cannot run."
                exit 1
              fi
            done
          fi
          npx playwright test -c playwright.portal.config.ts

      - name: Upload smoke artifacts (screenshots + HTML report only, NO auth state)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-portal-${{ github.run_id }}
          # Never e2e/.auth (session cookies).
          path: |
            e2e/results/smoke-portal/**/*.png
            e2e/results/smoke-portal-report/
          if-no-files-found: warn
          retention-days: 14

      # Find the PR for the deployed sha and post / update ONE comment. All values reach `run:` through env.
      - name: Find PR for the deployed sha
        if: always()
        id: findpr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Found PR: ${PR:-none}"

      - name: Comment smoke result on the PR
        if: always() && steps.findpr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.findpr.outputs.pr }}
          OUTCOME: ${{ job.status }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          MARKER="<!-- ui-smoke-report-portal-fargate -->"; WHERE="Deployed (Fargate)"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ]; then STATUS="✅ passed"; else STATUS="❌ failed"; fi
          BODY=$(printf '%s\n### UI smoke (portal) — %s\n\n%s: %s\n\n[Run & artifacts (screenshots + HTML report)](%s)\n' \
                   "$MARKER" "$STATUS" "$WHERE" "${BASE_URL:-n/a}" "$RUN_URL")
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "Created a new comment"
          fi

      # Scrub the Playwright auth storage state (live session cookies) regardless of outcome.
      - name: Delete auth state
        if: always()
        run: rm -rf .auth
