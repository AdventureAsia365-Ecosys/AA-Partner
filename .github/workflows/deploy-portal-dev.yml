name: Deploy Portal Dev

# AA-979 (CRM-P2b) — the Content studio (portal/, Next.js standalone) to ECS Dev: the Fargate service
# aa-crm-dev-portal behind the agency host portal.<zone> (AA-CIS-Infra accounts/aa365/crm_portal.tf +
# crm_agency_edge.tf). Same model as Deploy Web Dev: build on a native arm64 runner -> push to ECR with the immutable
# git-SHA tag -> new task definition revision copied from the family's LATEST revision with only the image swapped ->
# update the service -> wait stable -> post-deploy verify -> Playwright UI smoke. Same OIDC deploy role
# (aa-crm-dev-app-deploy; crm_app.tf extends it to the portal repository, family and service).
#
# No job guard: the studio runs no crm.job worker. Nothing here touches DNS. Since the S253 cutover portal.<zone>
# points at the agency distribution, so the checks go through DNS; when CRM_AGENCY_CF_DOMAIN is set they pin the host
# to that distribution instead (runner /etc/hosts).
#
# Post-deploy verify (AA-993 V3, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml with app crm-portal
# (also dispatchable with expected_sha; rows .github/verify/crm-portal.rows, plus .github/scripts/edge_verify.sh):
# ECS rollout COMPLETED with desired >= 1 on the built image, /api/healthz on this commit and version (on the agency
# host /healthz is the CRM web's), a public studio page and its /portal-assets, /tenant-login 308 to the partner
# sign-in (API-key sign-in off, AA-979 §4.5), the signed-out redirect to the CRM web's /auth/refresh, and the API rule.
# Then `smoke` runs ui-smoke-portal.yml with target fargate; there a missing studio sign-in (repository secrets
# E2EPORTALEMAIL / E2EPORTALPASSWORD / E2EPORTALTOTP) is red, never a skip. The `result` job ("Deploy Portal Dev
# result") is red when any job did not succeed, skipped included: read that one. Desired count 0 is red.
#
# Configuration (GitHub environment `dev`, VARIABLES, none secret):
#   AWS_ROLE_ARN              the deploy role (shared with Deploy Dev)
#   CRM_PORTAL_ENABLED        "true" once crm_portal.tf is applied; otherwise the run is red (config fails, AA-993)
#   AWS_REGION                default us-west-1
#   ECR_PORTAL_REPOSITORY     default aa-crm-dev-portal
#   ECS_CLUSTER               default aa-cis-dev-cluster
#   ECS_PORTAL_SERVICE        default aa-crm-dev-portal
#   ECS_PORTAL_TASK_FAMILY    default aa-crm-dev-portal
#   PORTAL_HOST               default portal.lumiguides.it.com
#   CRM_AGENCY_CF_DOMAIN      the crm_agency distribution's *.cloudfront.net name (Terraform output crm_agency_edge);
#                             the verify and the smoke pin the host to it; empty = DNS
#   PORTAL_PUBLIC_SENTRY_DSN  the browser Sentry DSN (public by design), baked in at build time; empty = off
#
# Pushes that only change the portal's unit tests do not deploy. Never changes the desired count.

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "!portal/lib/*.test.ts"
      - ".github/workflows/deploy-portal-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-portal-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # AA-993: red, not a skip. It used to output enabled=false and skip every job, which GitHub shows green.
      - name: Check AWS_ROLE_ARN and CRM_PORTAL_ENABLED
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          PORTAL_ENABLED: ${{ vars.CRM_PORTAL_ENABLED }}
        run: |
          if [ -z "${ROLE_ARN}" ] || [ "${PORTAL_ENABLED}" != "true" ]; then
            echo "::error::AWS_ROLE_ARN unset or CRM_PORTAL_ENABLED != true on environment 'dev': nothing can be deployed or verified (AA-CIS-Infra crm_portal.tf outputs)."
            exit 1
          fi

  deploy:
    name: Deploy portal to ECS Dev
    needs: config
    runs-on: ubuntu-24.04-arm
    environment: dev
    # The `dev` environment variables the smoke call needs (a job that calls a reusable workflow cannot read them).
    outputs:
      base_url: ${{ format('https://{0}', vars.PORTAL_HOST || 'portal.lumiguides.it.com') }}
      resolve_via: ${{ vars.CRM_AGENCY_CF_DOMAIN }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_PORTAL_REPOSITORY || 'aa-crm-dev-portal' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_PORTAL_SERVICE || 'aa-crm-dev-portal' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_PORTAL_TASK_FAMILY || 'aa-crm-dev-portal' }}
      PUBLIC_SENTRY_DSN: ${{ vars.PORTAL_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # IMMUTABLE repository: a re-deploy of the same commit reuses the image already pushed for this SHA.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" \
              --build-arg NEXT_PUBLIC_SENTRY_DSN="${PUBLIC_SENTRY_DSN}" -t "$IMAGE" portal
            docker image inspect "$IMAGE" --format '{{.Architecture}}' | grep -qx arm64
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          # family:revision only: the full ARN names the AWS account (public logs).
          echo "base task definition: $(jq -r '.taskDefinitionArn | split("/") | last' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: ${NEW_TD##*/}"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # AA-993 V3 (ADR 0016 D3) — the post-deploy checks (running image, desired count, the studio's commit and version,
  # studio page, assets, retired API-key sign-in, signed-out redirect, the API rule) moved to post-deploy-verify.yml, which is also
  # dispatchable on its own. It runs only when `deploy` succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
      app: crm-portal
      resolve_via: ${{ needs.deploy.outputs.resolve_via }}

  # The Playwright smoke of the studio on the agency host, logged-in pages included: require_tenant_login turns a
  # missing studio sign-in red here. AA-979 §4.5: the smoke signs in like a person (partner pool + authenticator code,
  # the e2e studio user's three secrets), not with an API key any more. Only those three are passed, never `inherit`.
  smoke:
    name: UI smoke (Fargate)
    needs: [deploy, verify]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ui-smoke-portal.yml
    with:
      base_url: ${{ needs.deploy.outputs.base_url }}
      sha: ${{ github.sha }}
      resolve_via: ${{ needs.deploy.outputs.resolve_via }}
      require_tenant_login: true
    secrets:
      E2EPORTALEMAIL: ${{ secrets.E2EPORTALEMAIL }}
      E2EPORTALPASSWORD: ${{ secrets.E2EPORTALPASSWORD }}
      E2EPORTALTOTP: ${{ secrets.E2EPORTALTOTP }}

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed config/deploy/verify
  # (the jobs after it then skip) could look like "nothing to verify". Every job here must succeed; skipped, failed or
  # cancelled is red on every event (no job in this workflow is conditional).
  result:
    name: Deploy Portal Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [config, deploy, verify, smoke]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 4 ]; then
            echo "::error::Deploy Portal Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Portal Dev ($EVENT): deployed, verified and smoke-tested."
