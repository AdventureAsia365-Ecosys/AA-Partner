name: Post-deploy verify
# AA-993 V2/V3 (ADR 0016 D3) — checks that Dev runs the commit that was just deployed, for one of three ECS services
# (input `app`):
#   crm         the CRM api (aa-crm-dev-api): rows .github/verify/crm.rows — /crm/health on that commit and version,
#               /crm/health/ready on a schema at least the newest crm-NNN that commit needs. Called by deploy-dev.yml.
#   crm-web     the CRM web (aa-crm-dev-web): rows crm-web.rows — /healthz on that commit and version, the host's /crm/*
#               rule reaching a ready API; plus the signed-out redirect (edge_verify.sh). Called by deploy-web-dev.yml.
#   crm-portal  the Content studio (aa-crm-dev-portal) on the agency host: rows crm-portal.rows — /api/healthz on that
#               commit and version, the API rule; plus a public studio page, its assets, the retired API-key
#               sign-in URL (308) and the signed-out redirect (edge_verify.sh). Called by deploy-portal-dev.yml (the Playwright smoke runs after it).
# Every app: ECS rollout COMPLETED with desired >= 1 on the built image (<registry>/<repo>:<sha>). Red/green only; the
# tables go to the job summary. Script: .github/scripts/post_deploy_verify.sh (same file as AA-Booking).
#
# Also dispatchable (verify what Dev runs now, or prove that a stale expected_sha goes red). A dispatch never touches
# the deploy concurrency groups (deploy-dev, deploy-web-dev, deploy-portal-dev).
# Configuration: the `dev` environment variables the deploy workflows read (AWS_ROLE_ARN, AWS_REGION, ECS_CLUSTER;
# ECR_REPOSITORY, ECS_SERVICE, CRM_API_BASE_URL; ECR_WEB_REPOSITORY, ECS_WEB_SERVICE, CRM_WEB_BASE_URL;
# ECR_PORTAL_REPOSITORY, ECS_PORTAL_SERVICE, PORTAL_HOST); no secret. Desired count 0 is red: the verify never scales
# up.
on:
  workflow_call:
    inputs:
      expected_sha:
        description: "The commit that was deployed (full 40-character SHA)."
        required: true
        type: string
      from_deploy:
        description: "Set by the deploy workflows: use a concurrency group of this run only (see the job)."
        required: false
        type: boolean
        default: false
      app:
        description: "crm (the api), crm-web (the CRM web) or crm-portal (the Content studio)."
        required: false
        type: string
        default: crm
      resolve_via:
        description: "Optional: a *.cloudfront.net name the base URL's host is pinned to on the runner; empty = DNS."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "The commit Dev should be running (full 40-character SHA)."
        required: true
        type: string
      app:
        description: "Which service: crm (the api), crm-web (the CRM web), crm-portal (the Content studio)"
        required: true
        type: choice
        options: [crm, crm-web, crm-portal]
        default: crm
      resolve_via:
        description: "Optional: a *.cloudfront.net name the base URL's host is pinned to on the runner; empty = DNS"
        required: false
        type: string
        default: ""
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    name: Post-deploy verify
    runs-on: ubuntu-latest
    # The deploy role trusts the subject ...:environment:dev; the dev variables live there too.
    environment: dev
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    # Dispatched runs share `post-deploy-verify-<app>` and queue there (never cancelled in progress). The call from a
    # deploy workflow gets a group of its own run: GitHub cancels the older PENDING job of a group when another one
    # queues, so a shared group would let a dispatch cancel a deploy's verify (and turn that run red). Deploy runs are
    # already one at a time per service (groups deploy-dev, deploy-web-dev, deploy-portal-dev).
    concurrency:
      group: ${{ inputs.from_deploy && format('post-deploy-verify-{0}-deploy-{1}-{2}', inputs.app, github.run_id, github.run_attempt) || format('post-deploy-verify-{0}', inputs.app) }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
    steps:
      - uses: actions/checkout@v7

      # The service, its image repository and its public base URL, from the same variables (and defaults) the
      # deploy workflow of that app reads. An unknown app is red.
      - name: Resolve the app
        id: app
        env:
          VERIFY_APP: ${{ inputs.app }}
          API_REPO: ${{ vars.ECR_REPOSITORY || 'aa-crm-dev-api' }}
          API_SERVICE: ${{ vars.ECS_SERVICE || 'aa-crm-dev-api' }}
          API_BASE: ${{ vars.CRM_API_BASE_URL || 'https://partner-dev.lumiguides.it.com' }}
          WEB_REPO: ${{ vars.ECR_WEB_REPOSITORY || 'aa-crm-dev-web' }}
          WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'aa-crm-dev-web' }}
          WEB_BASE: ${{ vars.CRM_WEB_BASE_URL || 'https://portal.lumiguides.it.com' }}
          PORTAL_REPO: ${{ vars.ECR_PORTAL_REPOSITORY || 'aa-crm-dev-portal' }}
          PORTAL_SERVICE: ${{ vars.ECS_PORTAL_SERVICE || 'aa-crm-dev-portal' }}
          PORTAL_HOST: ${{ vars.PORTAL_HOST || 'portal.lumiguides.it.com' }}
        run: |
          set -euo pipefail
          case "$VERIFY_APP" in
            crm)        REPO="$API_REPO";    SERVICE="$API_SERVICE";    BASE="$API_BASE";               EDGE=false ;;
            crm-web)    REPO="$WEB_REPO";    SERVICE="$WEB_SERVICE";    BASE="$WEB_BASE";               EDGE=true ;;
            crm-portal) REPO="$PORTAL_REPO"; SERVICE="$PORTAL_SERVICE"; BASE="https://${PORTAL_HOST}"; EDGE=true ;;
            *) echo "::error::app must be crm, crm-web or crm-portal (got '${VERIFY_APP}')"; exit 1 ;;
          esac
          {
            echo "VERIFY_APP=${VERIFY_APP}"
            echo "ECR_REPOSITORY=${REPO}"
            echo "ECS_SERVICE=${SERVICE}"
            echo "BASE=${BASE%/}"
          } >> "$GITHUB_ENV"
          echo "edge=${EDGE}" >> "$GITHUB_OUTPUT"
          echo "Verifying ${VERIFY_APP}: service ${SERVICE}, base ${BASE%/}"

      - name: AWS_ROLE_ARN is set
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Variable AWS_ROLE_ARN is not set on environment 'dev': nothing can be verified."
            exit 1
          fi

      # The expected version and required schema come from the expected commit itself, not from the checked-out
      # tree: a dispatch on main for an older SHA compares against what that SHA shipped.
      - name: Read what the expected commit ships
        id: expect
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character commit SHA (value not printed)"
            exit 1
          fi
          git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth 1 origin "$EXPECTED_SHA"
          # The newest crm-NNN of the REQUIRED_SCHEMA_VERSIONS tuple (readiness needs all of them).
          required_schema() { sed -n '/^REQUIRED_SCHEMA_VERSIONS/,/^)/p' | grep -o '"crm-[0-9]*"' | tr -d '"' | sort -t- -k2,2n | tail -n 1; }
          VERSION=$(git show "${EXPECTED_SHA}:.release-please-manifest.json" | jq -r '."."')
          REQUIRED=$(git show "${EXPECTED_SHA}:api/app/db.py" | required_schema || true)
          if [ -z "$REQUIRED" ]; then
            echo "::error::no crm-NNN in REQUIRED_SCHEMA_VERSIONS of api/app/db.py at ${EXPECTED_SHA}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "required=${REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "Expected ${EXPECTED_SHA}: version ${VERSION}, newest required CRM schema ${REQUIRED}"

      # Pin the base URL's host to a CloudFront distribution for this job only (curl reads /etc/hosts): the agency
      # host's distribution while portal. points elsewhere (before a cutover, during a rollback). Empty = DNS.
      - name: Pin the base URL's host (optional)
        if: inputs.resolve_via != ''
        env:
          VIA: ${{ inputs.resolve_via }}
        run: |
          set -euo pipefail
          [[ "$VIA" =~ ^[a-z0-9]+\.cloudfront\.net$ ]] || { echo "::error::resolve_via must be a *.cloudfront.net name"; exit 1; }
          HOST=$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlsplit(os.environ["BASE"]).hostname)')
          IP=$(getent ahostsv4 "$VIA" | awk 'NR==1{print $1}')
          [ -n "$IP" ] || { echo "::error::cannot resolve $VIA"; exit 1; }
          echo "$IP $HOST" | sudo tee -a /etc/hosts
          getent hosts "$HOST"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Same registry string as the build of every deploy workflow (steps.ecr.outputs.registry); never printed.
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify Dev
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ steps.expect.outputs.version }}
          REQUIRED_SCHEMA: ${{ steps.expect.outputs.required }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # The image the build pushes: <registry>/<repo>:<sha> (the deploy workflows' "Build and push image").
          export EXPECTED_IMAGE=""
          [ -z "$REGISTRY" ] || EXPECTED_IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${EXPECTED_SHA}"
          bash .github/scripts/post_deploy_verify.sh "$VERIFY_APP"

      # crm-web / crm-portal: what a row cannot express (a redirect's Location, an asset linked from a page). Runs
      # even when the step above failed, so the summary shows every check; never after a cancel.
      - name: Edge checks (sign-in redirect, studio assets)
        if: ${{ !cancelled() && steps.app.outputs.edge == 'true' }}
        run: bash .github/scripts/edge_verify.sh "$VERIFY_APP"
