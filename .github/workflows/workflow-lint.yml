name: Workflow Lint

# AA-1024 G15 (lessons guard; vendored from AA-CIS-Infra, S272): every workflow change is linted before it first runs
# (a workflow broken at its first run is a lesson that repeated, S220). Two layers:
#   1. actionlint, pinned (version + SHA-256 of the release tarball, checked before it runs): expression and context
#      errors, unknown keys, bad `needs`, invalid runner labels, action input typos (shellcheck / pyflakes off).
#   2. .github/scripts/workflow_lint.py (the same file in every repo), the rules actionlint does not know: no sensitive
#      `vars.*`, Playwright jobs on runs-on ubuntu-24.04, `npm ci` only with a git-tracked lockfile; its unit tests
#      run first.
#   Also the unit tests of .github/scripts/lychee_bin.py and the shape of the Docs lint link step (S273: the lychee
#   binary from a cached, hash-checked copy, .github/actions/lychee).
#   WL1 (no sensitive `vars.*`) is skipped here: deploy-dev.yml and friends still read vars.AWS_ROLE_ARN; moving it to
#   a secret is a repo-settings step for the tech lead. Drop `--skip WL1` once it is a secret.
# Offline apart from the actionlint download on a cache miss; no secret, no AWS. Not a required check (the ruleset is the tech lead's).

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/scripts/workflow_lint.py"
      - ".github/scripts/release_bin.py"
      - ".github/scripts/test_release_bin.py"
      - ".github/scripts/cache_cleanup.py"
      - ".github/scripts/test_cache_cleanup.py"
      - ".github/scripts/test_cache_warm.py"
      - ".github/scripts/test_workflow_lint.py"
      - ".github/scripts/lychee_bin.py"
      - ".github/scripts/test_lychee_bin.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/scripts/workflow_lint.py"
      - ".github/scripts/release_bin.py"
      - ".github/scripts/test_release_bin.py"
      - ".github/scripts/cache_cleanup.py"
      - ".github/scripts/test_cache_cleanup.py"
      - ".github/scripts/test_cache_warm.py"
      - ".github/scripts/test_workflow_lint.py"
      - ".github/scripts/lychee_bin.py"
      - ".github/scripts/test_lychee_bin.py"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint (actionlint + repo rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # S273 (AA-1024): actionlint v1.7.12 from .github/actions/release-bin (pins.txt: version + sha256 of the release
      # tarball, the same as the release's actionlint_1.7.12_checksums.txt), cached; downloaded only on a miss, through
      # an authenticated `gh release download`, and checked against the pin on every run.
      - name: Install actionlint (pinned, checksum verified)
        id: actionlint
        uses: ./.github/actions/release-bin
        with:
          tool: actionlint

      - name: actionlint
        run: actionlint -color -shellcheck= -pyflakes=

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Repo workflow rules
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python -B -m unittest discover -s .github/scripts -p 'test_workflow_lint.py'
          python -B -m unittest discover -s .github/scripts -p 'test_lychee_bin.py'
          python -B -m unittest discover -s .github/scripts -p 'test_release_bin.py'
          python -B -m unittest discover -s .github/scripts -p 'test_cache_cleanup.py'
          python -B -m unittest discover -s .github/scripts -p 'test_cache_warm.py'
          python -B .github/scripts/workflow_lint.py --skip WL1
