name: E2E Dev

# AA-936 (card CRM-08 "Playwright E2E"): the slice on Dev, end to end — the inquiry form on the client host, the card
# on the agency board, the trip workspace (e2e/tests/slice1.spec.ts). workflow_dispatch only: nothing runs on push or
# PR. Prerequisites (outside this repo): the Dev web + API deployed with crm-005 applied; the client host live
# (AA-CIS-Infra feat/aa-936-client-host); the seeded agency and its e2e owner (python -m app.seed --apply, AA-CIS-Infra
# tools/identity/crm_dev_identity.py e2e-users); GitHub environment `e2e` with secret E2E_MAIL_ROLE_ARN (the
# read-only e2e mailbox role, whose trust must list this repo's `e2e` environment on refs/heads/main) and variables
# E2ECRMCLIENT, E2ECRMPARTNER, E2ECRMFORMKEY, E2ECRMEMAIL.
# AA-939: once the CRM web signs in with the partner pool (required MFA), the owner signs in with password +
# authenticator: environment secrets E2ECRMPASSWORD and E2ECRMTOTP (from the e2e user's Secrets Manager entry written by
# AA-CIS-Infra tools/identity/crm_dev_identity.py e2e-users --pool partner). Empty = e-mail code sign-in (EXTERNAL).
# The one-off "invite -> active < 5 min" run (e2e/tests/invite.spec.ts) is the `invite` input, with variable
# E2ECRMINVITEE (the invitee address; reset its account first: crm_dev_identity.py invitee-reset --apply).
# AA-943 (CRM-15): e2e/tests/slice2-m1m2.spec.ts runs in the same job (stage engine, planning form, call slot, gates,
# Undo, bulk preview, cancel); it needs crm-012 applied and the AA-943 API + web deployed. Longer job timeout for it.
# AA-946 (CRM-18): e2e/tests/lifecycle-thin.spec.ts runs in the same job (agreements, proposal accept, mark paid, the
# portal and its Stage 3 lock, e-sign v0); it needs crm-016 applied and the AA-946 API + web deployed; its portal steps
# need PORTAL_OTP_DEV_ECHO=true on the Dev API (skipped with a note otherwise). Job timeout 25 -> 35 minutes.
# AA-947 (CRM-19): e2e/tests/aa-lines.spec.ts runs in the same job (Add AA item -> "AA pending" -> quoted with the
# "from"-price warning, card R 403s, Hold -> held + delete refused, Lost + Undo keeps the hold, Lost releases it). It
# needs the AA-947 API + web, the AA-973 synthetic supply on Booking, a Booking partner row and a per-person price hint
# on the seed plan (the spec checks both first), and variable E2ECRMAATOUR (the seed tour's CIS source_id). Optional:
# variable E2ECRMASSISTANTEMAIL with secrets E2ECRMASSISTANTPASSWORD / E2ECRMASSISTANTTOTP (the same agency's
# assistant: her confirm is refused 403); without them that step is a note. Job timeout 35 -> 50 minutes.
on:
  workflow_dispatch:
    inputs:
      invite:
        description: "AA-939: also run the timed invite -> active test (one-off; reset the invitee account first)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-dev
  cancel-in-progress: false

jobs:
  slice1:
    name: Slice 1 (Playwright, Dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: e2e
    timeout-minutes: 50
    defaults:
      run:
        working-directory: e2e
    env:
      E2ECRM: "1"
      E2ECRMCLIENT: ${{ vars.E2ECRMCLIENT }}
      E2ECRMPARTNER: ${{ vars.E2ECRMPARTNER }}
      E2ECRMFORMKEY: ${{ vars.E2ECRMFORMKEY }}
      E2ECRMEMAIL: ${{ vars.E2ECRMEMAIL }}
      E2ECRMINVITE: ${{ inputs.invite && '1' || '0' }}
      E2ECRMINVITEE: ${{ vars.E2ECRMINVITEE }}
      E2ECRMAATOUR: ${{ vars.E2ECRMAATOUR }}
      E2ECRMASSISTANTEMAIL: ${{ vars.E2ECRMASSISTANTEMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Exact versions in e2e/package.json; no lockfile on purpose (this folder never ships in an image). No install
      # scripts run, and every step that runs third-party code before the tests does so WITHOUT AWS credentials: the
      # mailbox role (it reads every e2e inbound mail, sign-in codes included) is configured just before the tests.
      - name: Install Playwright
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npx tsc --noEmit
      - name: Configure AWS credentials (OIDC, read-only mailbox role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.E2E_MAIL_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: crm-e2e-dev-${{ github.run_id }}
      - name: Run
        # The partner-pool credentials (owner; optional assistant) reach this step only (never the install steps above).
        env:
          E2ECRMPASSWORD: ${{ secrets.E2ECRMPASSWORD }}
          E2ECRMTOTP: ${{ secrets.E2ECRMTOTP }}
          E2ECRMASSISTANTPASSWORD: ${{ secrets.E2ECRMASSISTANTPASSWORD }}
          E2ECRMASSISTANTTOTP: ${{ secrets.E2ECRMASSISTANTTOTP }}
        run: npx playwright test
      # Screenshots only, never the reports (a fill step would name the sign-in code).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dev-${{ github.run_id }}
          path: e2e/results/*.png
          if-no-files-found: warn
          retention-days: 14
