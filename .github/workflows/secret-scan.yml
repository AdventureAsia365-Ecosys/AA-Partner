name: Secret Scan
# AA-981 follow-up: AA-Partner is public, so every commit of every branch and every pull request head is readable.
# Two gitleaks jobs, both with the default rules plus the repo rules in .gitleaks.toml (the same rules as the
# AA-Ecosys root repo and AA-CIS-Infra: DSN with an embedded password, plaintext password / API key in Terraform,
# credential-named key with a literal value in tfvars / .env / JSON / YAML):
#   - gitleaks (every PR, no path filter): the lines the PR's commits add (base..head). The rules and the baseline
#     (.gitleaks.toml, .gitleaksignore) are read from the PR's BASE commit, so a PR cannot add a secret together with
#     an ignore line or an allowlist entry and pass. A PR that changes either file, or adds a line with an inline
#     `gitleaks:allow` comment (that hides the line from both jobs), fails until a reviewer adds the label
#     `secret-scan-baseline-reviewed`; the scan then uses the PR's own copies. The label covers what the reviewer
#     saw: a later push that changes either file or adds another inline allow, a force push, or a (re)open with the
#     label already on removes it again (this job has `pull-requests: write` for that only). Both files are in
#     CODEOWNERS.
#   - gitleaks full history (nightly, every push to main, on demand): every commit of every branch and tag, plus
#     the head of every pull request (`refs/pull/*/head`: GitHub keeps them, closed PRs included, after the branch
#     is deleted, and anyone can fetch them). Findings that were already in history are pinned in .gitleaksignore,
#     so the job is green today and red on anything new.
# Until AA-981 the "Security Audit" job of ci.yml ran gitleaks over the full history with the PR's own ignore file;
# that step moved here (one scanner, one rule set). "Security Audit" keeps its name and its other checks.
# GitHub secret scanning and push protection are on as well (S248). Values are always redacted in the log.
# Known false positives: prefer a narrow allowlist entry in .gitleaks.toml (a class of values; it matches every
# commit, so it survives the squash merge). A commit fingerprint in .gitleaksignore does not survive the squash merge
# (see the header of that file). Both, and an inline allow comment, need the label. A real secret is never ignored:
# remove it, rotate it, then pin the old commit.
#
# Cost: public repo, Actions minutes are free. Each job takes about a minute.
#
# Run it locally (Docker, same pinned image; from a normal clone, not a git worktree):
#   IMG=ghcr.io/gitleaks/gitleaks:v8.28.0
#   docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo $IMG git /repo --log-opts="origin/main..HEAD" -c /repo/.gitleaks.toml -i /repo/.gitleaksignore --redact --verbose --no-banner
#   docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo $IMG git /repo -c /repo/.gitleaks.toml -i /repo/.gitleaksignore --redact --verbose --no-banner
# The second command covers local branches only; to include every PR head like CI, run it in a `git clone --mirror`.
on:
  pull_request:
    branches: [main]
    # labeled / unlabeled: rerun when `secret-scan-baseline-reviewed` is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "5 20 * * *" # 03:05 in Vietnam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest), same as AA-CIS-Infra and
# the AA-Ecosys root repo.
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  gitleaks:
    name: gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to remove a stale `secret-scan-baseline-reviewed` label (see the step below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans base..head

      - name: Scan the commits of this PR
        env:
          ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }} # not passed to the gitleaks container
          BASELINE_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'secret-scan-baseline-reviewed') }}
        run: |
          set +e
          cfg="$RUNNER_TEMP/gitleaks-cfg"
          mkdir -p "$cfg"
          label=secret-scan-baseline-reviewed
          guard=0
          # Files where the given commits add a line with an inline allow comment, which hides that line from both
          # jobs. Reads each commit's patch like gitleaks does (a merge commit as a dense combined diff, so only what
          # the merge itself adds). Prints file names only, never the lines.
          allow_files() {
            git log -p -U0 --cc --no-color --no-ext-diff --format= "$@" | awk '
              /^diff --/ { hdr = 1; next }
              /^@@/ { hdr = 0; next }
              hdr && /^\+\+\+ / { f = substr($0, 7); next }
              !hdr && /^(\+|.\+)/ && index($0, "gitleaks:allow") { print f }' | sort -u | tr '\n' ' '
          }
          # Rules and baseline come from the base branch: a PR cannot loosen the scan that judges it.
          touched=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- .gitleaks.toml .gitleaksignore | tr '\n' ' ')
          allowed=$(allow_files "${BASE_SHA}..${HEAD_SHA}")
          what=""
          [ -n "$touched" ] && what="changes ${touched}"
          [ -n "$allowed" ] && what="${what:+${what}and }adds an inline gitleaks:allow in ${allowed}"
          # The label covers only what the reviewer saw. It is removed when a later push changes either file or adds
          # another inline allow, when the previous head cannot be compared (force push), and on (re)open with the
          # label already on (pushes to a closed PR send no event).
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ]; then
            stale=""
            case "$ACTION" in
              opened|reopened) stale="the PR was ${ACTION} with the label already on" ;;
              synchronize)
                git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BEFORE_SHA" 2>/dev/null
                if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                  for f in .gitleaks.toml .gitleaksignore; do
                    if [ "$(git rev-parse -q --verify "${BEFORE_SHA}:${f}")" != "$(git rev-parse -q --verify "${HEAD_SHA}:${f}")" ]; then
                      stale="${stale}the last push changes ${f}; "
                    fi
                  done
                  new=$(allow_files "$HEAD_SHA" "^${BEFORE_SHA}" "^${BASE_SHA}")
                  [ -n "$new" ] && stale="${stale}the last push adds an inline gitleaks:allow in ${new}"
                else
                  stale="the previous head ${BEFORE_SHA} cannot be compared (force push)"
                fi ;;
            esac
            if [ -n "$stale" ]; then
              BASELINE_REVIEWED=false
              if gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/${label}" --silent; then
                echo "::warning title=gitleaks baseline::Removed the label ${label}: ${stale}"
              else
                echo "::error title=gitleaks baseline::${stale}, but the label ${label} could not be removed (fork PR?). A maintainer must remove it, review the change, then add it again."
              fi
            fi
          fi
          src="$BASE_SHA"
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ]; then
            echo "::notice title=gitleaks baseline::This PR ${what}and has the label ${label}: scanning with the PR's own copies."
            src="$HEAD_SHA"
          elif [ -n "$what" ]; then
            guard=1
            echo "::error title=gitleaks baseline::This PR ${what}(secret scan rules or baseline). The scan below uses the base branch copies. After review, add the label ${label} to rescan with the PR's copies."
          fi
          for f in .gitleaks.toml .gitleaksignore; do
            if ! git show "${src}:${f}" > "$cfg/$f" 2>/dev/null; then
              echo "::warning::${f} does not exist at ${src}; using the PR's copy (the PR that first adds it)."
              cp "$f" "$cfg/$f" 2>/dev/null || : > "$cfg/$f"
            fi
          done
          # gitleaks also loads <source>/.gitleaksignore on its own, on top of --gitleaks-ignore-path: put the
          # chosen copies in the checkout too (git mode reads commits, not these working-tree files).
          cp "$cfg/.gitleaks.toml" "$cfg/.gitleaksignore" .
          echo "Scanning the commits of this PR: ${BASE_SHA}..${HEAD_SHA} (rules from ${src})"
          # Run as the runner user so git inside the container accepts the checkout's ownership.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -v "$cfg:/cfg:ro" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config /cfg/.gitleaks.toml --gitleaks-ignore-path /cfg/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > scan.log 2>&1
          status=$?
          cat scan.log
          {
            echo '### Secret scan (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No secrets found.'
            else
              echo 'gitleaks reported findings (values redacted). Remove the secret from the PR commits and rotate'
              echo 'it (docs name secrets, they never hold values). For a false positive, prefer a narrow allowlist'
              echo 'entry in `.gitleaks.toml`: a commit fingerprint in `.gitleaksignore` does not survive the squash'
              echo 'merge (see that file). Either change needs the label `secret-scan-baseline-reviewed` after review.'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Fingerprint):' scan.log || true
              echo '```'
            fi
            if [ "$guard" -ne 0 ]; then
              echo "This PR ${what}(secret scan rules or baseline). It needs the label"
              echo '`secret-scan-baseline-reviewed`, added by a reviewer who has read that change, after the last'
              echo 'push that touched it.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks::A secret-like value was added in this PR. See the job summary."
          fi
          [ "$guard" -ne 0 ] && exit 1
          exit "$status"

  history:
    name: gitleaks full history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit of every branch and tag

      - name: Fetch the head of every pull request
        # Closed PRs included: GitHub keeps refs/pull/N/head after the branch is deleted, and they are public.
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan the full git history
        run: |
          set +e
          echo "Scanning $(git rev-list --all | wc -l) commits on $(git for-each-ref refs/remotes refs/tags | wc -l) refs (branches, tags, PR heads)"
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > scan.log 2>&1
          status=$?
          cat scan.log
          {
            echo '### Secret scan, full history (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No new secrets in history (known findings are pinned in `.gitleaksignore`).'
            else
              echo 'gitleaks found a secret in history that is not in the baseline (values redacted).'
              echo 'A real secret: rotate it first (the repo is public, history is readable), then add its'
              echo 'fingerprint to `.gitleaksignore` with a comment. A false positive: a narrow allowlist entry in'
              echo '`.gitleaks.toml`, or its fingerprint in `.gitleaksignore`.'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Date|Fingerprint):' scan.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks full history::New secret-like finding in git history. See the job summary."
          fi
          exit "$status"
