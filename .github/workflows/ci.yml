name: CI

# Required checks (branch protection on main; names like AA-Booking's and AA-CIS-App's so the rules read the same):
#   Lint, Security Audit, Unit Tests, Integration Tests, Docker Build Check, Web Build (since AA-994 hand step H1; the
#   "Portal Build" check went with portal/ in AA-1036 R3 slice 2), plus Docs lint, PR title and gitleaks from their own
#   workflows. "Integration Tests" is the
#   aggregate of the "Integration shard i/N" matrix jobs (AA-1032), which are not required themselves.
# Non-required: "Vendored CIS copies" (byte copies of AA-CIS-App files: the job table template + comparator, ADR 0003a,
# the multi-issuer verifier, ADR 0006 §8 rule 9, and the web's BFF helpers, AA-935).
# Non-required (AA-993 M4b): "Migration preflight" classifies a PR's new crm-NNN files (expand = auto-applied, else
# a person applies them) and refuses what would leave Deploy Dev waiting on a manual apply (pull_request, merge_group).
# UI kit core (AA-994 S2a, root ADR 0016): web/app/_kit/core is checked inside Web Build (integrity + provenance against
# kit.lock.json), not by "Vendored CIS copies".
# CRM web (web/, AA-935): "Web Build" (unit tests, next build with the type check, standalone smoke, kit lint) and "Web
# Docker Build Check" (native arm64 image, container smoke, Trivy). Web Build is required; the image check is meant to join.
# Content studio: part of the web since AA-1036 (R3, root ADR 0019 d6); the separate portal/ app, its "Portal Build" and
# "Portal Docker Build Check" jobs and its deploy were removed in R3 slice 2. ESLint with the kit preset at error and a
# suppressions file that only shrinks runs inside Web Build (AA-994 S2b).
#
# ARM: the API runs on Fargate ARM64 (ADR 0010 decision 2), so the image is built and smoke-tested on a native arm64
# runner (ubuntu-24.04-arm, free for public repositories); the Python jobs run on x64 (pure-Python code, the pinned
# wheels exist for both).

#
# S271 (CI minutes, AA-889 merge queue): what runs on which event. Main is protected by the merge queue: every commit
# that lands on main is a queue group commit that passed the FULL run first, so the run on `push` to main (the same
# tree tested again) is gone; Deploy Dev / Deploy Web Dev trigger on push themselves, never on this workflow.
#   merge_group, workflow_dispatch: every job, no path filter, no skip. The merge queue's guarantee is unchanged.
#   pull_request: the fast checks (Lint, Vendored CIS copies, Security Audit, Unit Tests, Migration preflight, and
#     Web Build without `next build` and the standalone smoke, with the type check instead). The heavy jobs
#     (Integration Tests, Docker Build Check, Web Docker Build Check, the web build; Visual in visual.yml) run on the
#     queue, unless the PR touches their area (Lint step Scope, .github/scripts/ci_scope.py): migrations or
#     integration tests -> Integration Tests, the API image inputs -> Docker Build Check, the web image inputs -> Web
#     Docker Build Check. Web Build is skipped for a PR that does not touch web/; a docs-only PR (every path under docs/
#     or *.md) skips the test jobs; a PR that changes .github/ runs everything.
#   A skipped job reports "skipped", which counts as passed for a required check, so every required check still
#   reports on a PR and it can enter the queue. Trade-off: a heavy failure is found in the queue (the group fails, the
#   PR leaves the queue) instead of on the PR. To see the heavy jobs before queueing, dispatch this workflow on the PR
#   branch (gh workflow run ci.yml --ref <branch>): its checks land on the PR head.

on:
  pull_request:
    branches: [main]
  # AA-889 (merge queue): the queue tests each group on a temporary gh-readonly-queue/main/* commit and waits for
  # every required check there. All jobs run on it, with no path filter, so no required check is left unreported.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  # S271: Lint also carries the CI scope of a pull request (its outputs gate the test and build jobs below; the step
  # never fails the job, and a broken scope leaves the outputs empty, so every gated job runs: they test != 'false').
  # "Vendored CIS copies" stays its own non-required job: it compares with CIS main, which a PR here does not
  # control, so folding it into the required Lint would let a CIS change block every PR of this repo.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      integration: ${{ steps.scope.outputs.integration }}
      docker: ${{ steps.scope.outputs.docker }}
      web: ${{ steps.scope.outputs.web }}
      webdocker: ${{ steps.scope.outputs.webdocker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2    # the pull_request merge commit and its first parent (the base tip)

      - name: Scope (what this pull request needs)
        id: scope
        continue-on-error: true
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 .github/scripts/ci_scope.py --event "$EVENT" \
            --area integration=api/migrations/,api/tests/integration/ \
            --area docker=api/Dockerfile,api/.dockerignore,api/requirements.txt,.trivyignore \
            --area web=web/,api/scripts/check_kit_provenance.py \
            --area webdocker=web/Dockerfile,web/.dockerignore,web/package.json,web/package-lock.json,.trivyignore \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # pip-audit FAILS here (as in AA-Booking). The same job runs the DM-6.10 resource-ID check (this repo is public). The
  # gitleaks scan that ran here moved to .github/workflows/secret-scan.yml (AA-981 follow-up): check "gitleaks" on every
  # PR with the base branch's rules (.gitleaks.toml, .gitleaksignore), "gitleaks full history"
  # (secret-scan-history.yml) nightly and on push to main.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # DM-6.10 (D-25): no AWS account ID, ARN with an account, VPC/SG/subnet ID, Cognito pool ID or API Gateway host
      # in any tracked file. Stdlib only; byte copy of AA-Booking's script (AA-902).
      - name: No literal AWS resource IDs (failing)
        working-directory: .
        run: python3 .github/scripts/check_resource_ids.py

      - name: pip-audit (runtime + dev requirements, failing)
        run: |
          pip install pip-audit==2.10.1 --quiet
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      # AA-935: the CRM web's npm dependencies (runtime and dev), from the lockfile, failing on high or critical.
      - name: npm audit (web, failing on high)
        working-directory: web
        run: npm audit --audit-level=high

  # S271: skipped only for a docs-only pull request (Lint's scope output tests=false); a failed scope runs it.
  test-unit:
    name: Unit Tests
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.tests != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Includes the route-class guard over every served path, the job payload guard (ids only), the DB access lint,
      # the import boundary, the deploy preflight script (stub aws/curl) and the vendored-copy checker.
      # AA-993 (P3): the Python 3.12 sys.monitoring coverage tracer, about 1.7x faster here with the same TOTAL.
      # AA-1032: 4 pytest-xdist workers (pinned in requirements-dev.txt); `--dist loadfile` keeps each test file on one
      # worker (module fixtures and module state stay per file). Locally the same 3133 tests and the same per-file
      # coverage report as the single process, 180 s -> 58 s; pytest-cov combines the workers before the 90% gate.
      - name: Run unit tests
        env:
          ENVIRONMENT: test
          COVERAGE_CORE: sysmon
        run: pytest tests/unit -v -n 4 --dist loadfile --tb=short --cov=app --cov-report=term-missing --cov-fail-under=90

  # Applies api/migrations/*.sql in order to a real PostgreSQL 15 (the RDS major) as AA-CIS-Infra DB Migrate does:
  # logged in as aa_cis_admin (NOT superuser, the RDS master shape), each file as crm_owner (SET ROLE), after a role
  # bootstrap that mirrors Infra rl-003 / rl-004 (tests/integration/bootstrap_roles.py). Then: re-apply (idempotency),
  # the base-table catalogue guard, cross-tenant RLS, tenant_tx() as crm_app, crm.job against the ADR 0003a template,
  # lease re-claim of a stopped worker, /crm/health/ready as crm_app.
  # AA-1032: INTEGRATION_SHARDS parallel jobs ("Integration shard i/N"), each with its OWN Postgres (its session fixture
  # bootstraps the roles and applies every migration, as the single job did). Each shard is one consecutive range of
  # the path-ordered files (.github/scripts/ci_shards.py --contiguous, balanced on .github/test-durations/
  # integration.json), so a module keeps the predecessors it had in the single job. The required check keeps its name:
  # "Integration Tests" below passes only when every shard passed. Before (main, 01/11/2026): one job, 6-9 min.
  # S271: merge_group and dispatch always; a pull request only when it touches migrations or the integration tests.
  test-integration-shard:
    name: Integration shard ${{ matrix.shard }}/3
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      INTEGRATION_SHARDS: 3
      SHARD: ${{ matrix.shard }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only # gitleaks:allow (throwaway CI service container)
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # -rs lists skips; a skipped integration test would make this check green without testing anything.
      - name: Run integration tests (this shard, no skips allowed)
        env:
          ENVIRONMENT: test
          CRM_TEST_ADMIN_DSN: postgresql://aa_cis_admin:ci-only@localhost:5432/crm_ci # gitleaks:allow (CI-only)
        run: |
          set -euo pipefail
          python -m tests.integration.bootstrap_roles "postgresql://postgres:ci-only@localhost:5432/crm_ci" # gitleaks:allow (CI-only)
          mapfile -t FILES < <(python3 ../.github/scripts/ci_shards.py files --contiguous --shards "$INTEGRATION_SHARDS" \
            --index "$SHARD" --durations ../.github/test-durations/integration.json tests/integration)
          echo "Integration shard $SHARD/$INTEGRATION_SHARDS: ${#FILES[@]} test files"
          pytest "${FILES[@]}" -v --tb=short -rs -p no:cacheprovider \
            --junitxml="junit-integration-$SHARD.xml" -o junit_family=xunit1 | tee /tmp/integration.txt
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/integration.txt; then
            echo "::error::integration tests were skipped"; exit 1
          fi

      - name: Upload the shard's junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-shard-${{ matrix.shard }}
          path: api/junit-integration-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 5

  test-integration:
    name: Integration Tests
    needs: [lint, test-integration-shard]
    # Runs when a shard failed too, so the required check turns red instead of "skipped" (a skipped required check
    # counts as passed). Skipped (= passed) only with the shards, on a pull request outside their area (S271).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every integration shard passed
        env:
          RESULT: ${{ needs.test-integration-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::an integration shard did not pass (result: $RESULT); see the 'Integration shard i/N' jobs"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: integration-shard-*
          merge-multiple: true
          path: shards

      # Report only: each shard's real seconds, and the per-file durations of this run as an artifact to refresh
      # .github/test-durations/integration.json when the shards drift apart.
      - name: Shard balance (report)
        run: |
          python3 .github/scripts/ci_shards.py durations --out integration-durations.json \
            shards/junit-integration-*.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: test-durations-integration
          path: integration-durations.json
          if-no-files-found: ignore
          retention-days: 14

  # S271: merge_group and dispatch always; a pull request only when it changes the API image inputs.
  docker-build:
    name: Docker Build Check
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.outputs.docker != 'false') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The release version comes from the manifest at the repo root, like the Deploy Dev build.
      - name: Build image (linux/arm64, native)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' ../.release-please-manifest.json)" \
            --tag aa-crm-api:ci-${{ github.sha }} \
            .
          docker image inspect aa-crm-api:ci-${{ github.sha }} --format '{{.Architecture}}' | grep -qx arm64

      # The image must start and answer liveness without a database (ALB health check contract).
      - name: Container answers /crm/health without a database
        run: |
          set -euo pipefail
          docker run -d --name crm-ci -p 8000:8000 aa-crm-api:ci-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/crm/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          jq -e --arg sha "${{ github.sha }}" --arg ver "$(jq -r '."."' ../.release-please-manifest.json)" \
            '.status == "ok" and .service == "aa-crm-api" and .git_sha == $sha and .version == $ver' /tmp/health.json
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/crm/health/ready)
          cat /tmp/ready.json
          [ "$code" = "503" ] && jq -e '.db == "not_configured"' /tmp/ready.json
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/crm/v1/me)
          [ "$code" = "401" ]
          docker rm -f crm-ci

      # Blocking, like CIS and Booking: fails on any CRITICAL/HIGH finding that HAS a fix (`ignore-unfixed`). An
      # accepted fixable finding goes into .trivyignore with a `# reason` line and `exp:YYYY-MM-DD` at most 90 days
      # ahead (.github/scripts/check_trivyignore.py, byte copy of the AA-CIS-App script).
      - name: Trivy ignore entries carry a reason and an expiry
        working-directory: .
        run: python3 .github/scripts/check_trivyignore.py .trivyignore

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-crm-api:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: "aa-crm-api:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

  # Non-required: byte copies of AA-CIS-App files (api/tests/job_template/, api/app/auth/identity_verifier.py, the
  # web's lib/ BFF helpers). Fails when a copy drifts from CIS main. Stdlib only; the repos are public,
  # github.token only lifts the API rate limit. The UI kit is not here since AA-994 S2a (kit.lock.json checks).
  vendored-copies:
    name: Vendored CIS copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the vendored CIS files with AA-CIS-App main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_vendored_copies.py

  # AA-993 M4b (root ADR 0017 d1, design D2.1; critic 7, 17): "Migration preflight". Tells the author of a PR that
  # adds a migration whether it will be auto-applied (header `-- migrate: expand`, lint clean, classify evidence
  # expand) or needs a person (contract / destructive: MIG-4), and refuses: an edit/delete of a file already copied to
  # AA-CIS-Infra, a number other than main max + 1 (label migration:out-of-order for a reserved one), a readiness raise
  # to a non-expand file or to a key with no file, a runner/ownership lint error, an expand header the classify replay
  # contradicts. Tools: AA-CIS-Infra db/run_migration.py --inspect, db/check_migration_ownership.py and
  # db/expand_check.py --classify at the pinned INFRA_TOOLS_SHA (public repo, anonymous clone; bump the pin when the
  # Infra runner changes). The Infra copy PR's required "Expand classify" and Migration Apply's re-classify stay the
  # authority. Runs on pull_request and merge_group (the queue re-checks the number on the latest main). A PR that
  # touches no migration and no readiness key skips the Infra tools and the classify replay, but "Preflight verdict"
  # always runs (no `if:`): its dangling-reference check (migration_refs.py) reads the added lines of EVERY PR, so a
  # PR that only adds a doc / test line naming a renumbered migration's old number is refused too (AA-1024; pinned by
  # test_migration_refs.py). Logic: .github/scripts/migration_preflight.py.
  # Same steps in AA-CIS-App, AA-Booking and AA-Partner; only the env block differs.
  migration-preflight:
    name: Migration preflight
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read    # the PR's labels (migration:out-of-order), read live
    defaults:
      run:
        working-directory: .
    env:
      OWNER: crm
      MIG_DIR: api/migrations
      READINESS_FILE: api/app/db.py
      # Public readiness of Dev: registered_keys tell whether a lower key of this owner still waits for a person.
      READY_URL: https://partner-dev.lumiguides.it.com/crm/health/ready
      INFRA_REPO: AdventureAsia365-Ecosys/AA-CIS-Infra
      # AA-CIS-Infra main after M3 (#493/#494): run_migration.py with the expand lint, expand_check.py --classify.
      INFRA_TOOLS_SHA: 3b999913ba990e5e2ca8d3fbd8efb4d44980ca76
      # pgvector/pgvector:0.8.1-pg15, the image of the Infra classify and DB Schema Dump replay.
      REPLAY_IMAGE: pgvector/pgvector@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: What the PR changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The label is read live in both cases (not from the event payload): adding migration:out-of-order and
          # "Re-run jobs" is enough, no empty commit needed.
          if [ "$EVENT" = "merge_group" ]; then
            BASE="$GROUP_BASE"
            git fetch --quiet --depth=1 origin "$BASE"
            PR=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$GROUP_REF")
          else
            BASE=$(git rev-parse HEAD^1)    # the merge commit's first parent = the base this PR is tested on
            PR="$PR_NUMBER"
          fi
          OOO=false
          if [ -n "$PR" ] && gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'migration:out-of-order'; then OOO=true; fi
          git diff --name-status --no-renames "$BASE" HEAD -- "$MIG_DIR" "$READINESS_FILE" | tee changes.txt
          ADDED=$(grep -cE "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt || true)
          {
            echo "base=$BASE"
            echo "ooo=$OOO"
            echo "relevant=$([ -s changes.txt ] && echo true || echo false)"
            echo "added=$ADDED"
          } >> "$GITHUB_OUTPUT"

      - name: Pinned AA-CIS-Infra tools and the Infra copy list
        id: infra
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -uo pipefail
          git init -q infra && git -C infra remote add origin "https://github.com/$INFRA_REPO.git"
          if git -C infra fetch -q --depth 1 origin "$INFRA_TOOLS_SHA" && git -C infra checkout -q FETCH_HEAD; then
            echo "tools=infra" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AA-CIS-Infra $INFRA_TOOLS_SHA not readable (private?): header only, no runner lint"
          fi
          mkdir -p infra-main
          if git -C infra fetch -q --depth 1 origin main && git -C infra archive FETCH_HEAD db/migrations | tar -x -C infra-main; then
            echo "copies=infra-main/db/migrations/$OWNER" >> "$GITHUB_OUTPUT"
            echo "AA-CIS-Infra main: $(git -C infra rev-parse --short FETCH_HEAD)"
          else
            echo "::warning::AA-CIS-Infra main not readable: every migration on main counts as copied"
          fi

      - name: Classify the added files (expand post-check on a replay of Dev)
        id: classify
        if: steps.scope.outputs.added != '0' && steps.infra.outputs.tools == 'infra' && steps.infra.outputs.copies != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pip install --quiet asyncpg==0.30.0 pyyaml==6.0.2
          # Each owner's main with the Infra copies laid over it (as Migration Apply does); this PR's folder for its owner.
          declare -A SRC=([cis]="AA-CIS-App api/migrations" [booking]="AA-Booking migrations"
                          [tripplanner]="AA-TripPlanner-Web migrations" [crm]="AA-Partner api/migrations")
          ARGS=(--source roles=infra-main/db/migrations/roles)
          for o in cis booking tripplanner crm; do
            mkdir -p "replay/$o"
            if [ "$o" = "$OWNER" ]; then
              cp "$MIG_DIR"/*.sql "replay/$o/"
            else
              read -r repo dir <<<"${SRC[$o]}"
              git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/AdventureAsia365-Ecosys/$repo.git" "owners/$o"
              git -C "owners/$o" sparse-checkout set "$dir"
              cp "owners/$o/$dir"/*.sql "replay/$o/"
              cp infra-main/db/migrations/"$o"/*.sql "replay/$o/" 2>/dev/null || true
            fi
            ARGS+=(--source "$o=replay/$o")
          done
          RUN=$(gh run list -R "$INFRA_REPO" --workflow db-schema-dump.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" -R "$INFRA_REPO" -n "db-schema-dump-$RUN" -D dump 2>/dev/null \
              && [ -s dump/schema.json ]; then
            ARGS+=(--live dump/schema.json); echo "replay order: the live dump of AA-CIS-Infra DB Schema Dump run $RUN"
          else
            echo "::notice::no AA-CIS-Infra DB Schema Dump artifact readable: the replay falls back to number order"
          fi
          ARGS+=(--files)
          while read -r f; do ARGS+=("$OWNER/$(basename "$f")"); done \
            < <(grep -E "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt | cut -f2)
          PW="$(openssl rand -hex 16)"
          docker run -d --name classify-db -e POSTGRES_PASSWORD="$PW" -p 127.0.0.1:55432:5432 "$REPLAY_IMAGE" >/dev/null
          for _ in $(seq 1 60); do docker exec classify-db pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 2; done
          python3 infra/db/expand_check.py --classify "${ARGS[@]}" \
            --admin-dsn "postgresql://postgres:${PW}@127.0.0.1:55432/postgres" \
            --out classify.json --summary "$GITHUB_STEP_SUMMARY" > classify.log 2>&1
          STATUS=$?
          grep -v '^REPLAY ok' classify.log || true
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          docker rm -f classify-db >/dev/null 2>&1 || true

      - name: Preflight verdict
        env:
          BASE: ${{ steps.scope.outputs.base }}
          TOOLS: ${{ steps.infra.outputs.tools }}
          COPIES: ${{ steps.infra.outputs.copies }}
          CLASSIFY_STATUS: ${{ steps.classify.outputs.status }}
          OOO: ${{ steps.scope.outputs.ooo }}
        run: |
          ARGS=(--app "$OWNER" --migrations-dir "$MIG_DIR" --readiness-file "$READINESS_FILE" --base "$BASE")
          [ -n "$TOOLS" ] && ARGS+=(--infra-tools "$TOOLS")
          [ -n "$COPIES" ] && ARGS+=(--infra-copies "$COPIES")
          [ -s classify.json ] && ARGS+=(--classify-json classify.json)
          [ -n "$CLASSIFY_STATUS" ] && ARGS+=(--classify-status "$CLASSIFY_STATUS")
          [ "$OOO" = "true" ] && ARGS+=(--allow-out-of-order)
          python3 .github/scripts/migration_preflight.py "${ARGS[@]}" --ready-url "$READY_URL"

  # AA-935 — the CRM web (Next.js standalone). Unit tests (vitest: dates/locale, session sealing, OAuth, host routing,
  # BFF allow-list, route handlers), then `next build` (it runs the TypeScript check), then the standalone server is
  # started with fake configuration and must answer /healthz, refuse an unknown Host and send a page without a
  # session to /auth/refresh. NODE_OPTIONS caps the build's heap like the Dockerfile does.
  # S271: skipped for a pull request that does not touch web/ (Lint's scope output web); on a pull request `next build`
  # and the standalone smoke wait for the queue and the type check (tsc --noEmit) runs instead.
  web-build:
    name: Web Build
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # AA-994 S2a (root ADR 0016 decision 5) — the vendored UI kit core, before npm ci (dependency-free). Integrity:
      # every file of app/_kit/core has the sha256 of its MANIFEST.json, no file is missing or extra, the manifest is the
      # one kit.lock.json pins, and no CSS file outside core/tokens.css defines an --aa-* variable. Provenance: that
      # manifest is AA-CIS-App's at the lock's ref and the ref is on CIS main (reads GitHub only when this change
      # touches web/kit.lock.json or web/app/_kit/core; otherwise it passes at once).
      - name: Kit core integrity (check-kit-copy.mjs)
        run: |
          node app/_kit/core/check-kit-copy.mjs
          node app/_kit/core/check-kit-copy.mjs --css .

      - name: Kit core provenance (kit.lock.json ref on AA-CIS-App main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 ../api/scripts/check_kit_provenance.py kit.lock.json --base "$BASE_SHA"

      - name: Install (lockfile only)
        id: install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type check (pull request; the queue's build runs it)
        if: github.event_name == 'pull_request'
        run: npm run typecheck

      - name: Build (includes the type check)
        if: github.event_name != 'pull_request'
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Standalone server smoke
        if: github.event_name != 'pull_request'
        env:
          ENVIRONMENT: test
          PORT: "3005"
          HOSTNAME: 127.0.0.1
          WEB_PUBLIC_ORIGIN: http://localhost:3005
          WEB_PARTNER_HOSTS: localhost:3005
          CRM_API_ORIGIN: http://127.0.0.1:9
          COGNITO_DOMAIN: https://auth.example.test
          COGNITO_CLIENT_ID: ciclient
          COGNITO_CLIENT_SECRET: x
          WEB_SESSION_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3005/healthz -o /tmp/healthz.json && break; sleep 1; done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "$GIT_SHA" '.status == "ok" and .service == "aa-crm-web" and .git_sha == $sha and .auth_configured == true' /tmp/healthz.json
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.test' http://localhost:3005/)" = "404" ]
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3005/pipeline)
          echo "$loc" | grep -q '^http://localhost:3005/auth/refresh?next=%2Fpipeline$'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/bff/me)" = "401" ]
          # AA-1025: the studio's identity probe is the literal route (not the catch-all) and is always 200.
          curl -sf http://localhost:3005/bff/identity | jq -e '. == {"kind": "signed_out"}'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/signed-out)" = "200" ]
          curl -sI http://localhost:3005/signed-out | grep -qi "^content-security-policy: frame-ancestors 'none'"
          # AA-1036 (R3 slice 1): the Content studio inside this app. The retired API-key sign-in and the old legal
          # paths answer 308; the studio's legal pages are public; a studio page without a session goes to the refresh;
          # the studio BFF answers 401 JSON, the app switcher 200.
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3005/tenant-login)" = "308 http://localhost:3005/auth/refresh?next=%2Fportal%2Fdashboard" ]
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3005/terms)" = "308 http://localhost:3005/legal/partner-terms" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/legal/partner-terms)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/legal/privacy)" = "200" ]
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3005/portal/dashboard)
          echo "$loc" | grep -q '^http://localhost:3005/auth/refresh?next=%2Fportal%2Fdashboard$'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/api/tenant/me)" = "401" ]
          curl -sf http://localhost:3005/api/studio/apps | jq -e '.apps | map(.key) == ["content", "crm", "planner"]'
          curl -sf http://localhost:3005/api/healthz | jq -e --arg sha "$GIT_SHA" '.ok == true and .studio == "merged" and .sha == $sha'

      # AA-994 S2b (root ADR 0016 decision 7, plan guards G1-G9, G11) — kit lint inside this job, so it gates with it.
      # Page code is linted with the kit preset (app/_kit/core/eslint-kit.mjs, `inline`) at `error`; violations that
      # existed before S2b are frozen in web/eslint-suppressions.json (ESLint bulk suppressions), which only shrinks:
      #   1. `eslint --prune-suppressions` fails on any violation the file does not cover and rewrites the file;
      #   2. the committed file must equal the pruned one (a fix that did not prune its entries fails);
      #   3. no entry and no rule total may grow against the base branch's file (a `--suppress-all` that hides new
      #      violations fails), a new entry may only carry a deleted/renamed file's violations into a file the base did
      #      not have, and no entry may name a deleted file;
      #   4. no inline `eslint-disable` of a kit rule (or bare `eslint-disable`) in page code.
      # They run even when an earlier step failed (once npm ci succeeded), so one run shows every reason.
      - name: ESLint (kit preset at error, suppressions pruned)
        id: eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npx eslint --prune-suppressions 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"
          STATUS=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep -E "problems? \(" "$RUNNER_TEMP/lint-output.txt" | tail -n1)
          {
            echo "### Web ESLint"
            echo ""
            echo "${SUMMARY_LINE:-No unsuppressed problems.}"
            echo ""
            echo "_Kit rules at error (root ADR 0016 decision 7); pre-existing violations are frozen in web/eslint-suppressions.json, which only shrinks._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Suppressions file is pruned
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        run: |
          if ! git diff --exit-code -- eslint-suppressions.json; then
            echo "::error file=web/eslint-suppressions.json::Violations were fixed but their suppressions were not removed. Run 'npx eslint --prune-suppressions' in web/ and commit eslint-suppressions.json (the diff above)."
            exit 1
          fi
          git checkout -- eslint-suppressions.json

      - name: Suppressions do not grow
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::No base commit for this event: suppressions growth check skipped."
              exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_FILE="$RUNNER_TEMP/base-eslint-suppressions.json"
          if ! git show "$BASE_SHA:web/eslint-suppressions.json" > "$BASE_FILE" 2>/dev/null; then
            echo "::notice::The base commit has no web/eslint-suppressions.json (this change creates the baseline): growth check skipped."
            exit 0
          fi
          BASE_LIST="$RUNNER_TEMP/base-web-files.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- . > "$BASE_LIST"  # paths relative to web/ (the cwd)
          # AA-1036 (R3 slice 1): the Content studio moves from portal/ into web/; its frozen entries count as the base
          # of their new web paths (never for a path the base web tree has), so a moved file keeps and never grows its
          # count. No portal file at the base (after R3 slice 2) = the base web file as it is.
          BASE_PORTAL="$RUNNER_TEMP/base-portal-eslint-suppressions.json"
          git show "$BASE_SHA:portal/eslint-suppressions.json" > "$BASE_PORTAL" 2>/dev/null || BASE_PORTAL="-"
          python3 ../.github/scripts/studio_suppressions_base.py "$BASE_FILE" "$BASE_PORTAL" "$BASE_LIST" "$BASE_FILE.merged"
          node app/_kit/core/check-kit-copy.mjs --suppressions "$BASE_FILE.merged" eslint-suppressions.json --base-files "$BASE_LIST"

      - name: No inline disable of a kit rule
        if: ${{ !cancelled() }}
        run: |
          node app/_kit/core/check-kit-copy.mjs --no-kit-disable app --ignore _kit/core
          node app/_kit/core/check-kit-copy.mjs --no-kit-disable components

  # AA-935 — the CRM web image: native arm64 (Fargate ARM64, ADR 0010 decision 2), container answers /healthz with its
  # commit, Trivy fails on fixable CRITICAL/HIGH like the API image.
  # S271: merge_group and dispatch always; a pull request only when it changes the web image inputs.
  web-docker-build:
    name: Web Docker Build Check
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.outputs.webdocker != 'false') }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Build image (linux/arm64, native)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' .release-please-manifest.json)" \
            --tag aa-crm-web:ci-${{ github.sha }} \
            web
          docker image inspect aa-crm-web:ci-${{ github.sha }} --format '{{.Architecture}}' | grep -qx arm64

      - name: Container answers /healthz without any configuration
        run: |
          set -euo pipefail
          docker run -d --name crm-web-ci -p 3000:3000 aa-crm-web:ci-${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz -o /tmp/healthz.json && break; sleep 1; done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "${{ github.sha }}" '.status == "ok" and .git_sha == $sha and .auth_configured == false' /tmp/healthz.json
          [ "$(docker inspect --format '{{.Config.User}}' crm-web-ci)" = "10001" ]
          docker rm -f crm-web-ci

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-crm-web:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"
