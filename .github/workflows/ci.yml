name: CI

# Required checks (branch protection on main; names like AA-Booking's and AA-CIS-App's so the rules read the same):
#   Lint, Security Audit, Unit Tests, Integration Tests, Docker Build Check.
# Non-required: "Vendored CIS copies" (byte copies of AA-CIS-App files: the job table template + comparator, ADR 0003a,
# the multi-issuer verifier, ADR 0006 §8 rule 9, and the web's and portal's BFF helpers, AA-935 / AA-979).
# UI kit core (AA-994 S2a, root ADR 0016): portal/app/_kit/core and web/app/_kit/core are checked inside Portal Build and
# Web Build (integrity + provenance against kit.lock.json), not by "Vendored CIS copies".
# CRM web (web/, AA-935): "Web Build" (unit tests, next build with the type check, standalone smoke) and "Web Docker
# Build Check" (native arm64 image, container smoke, Trivy). Both are meant to join the required checks.
# Tenant portal (portal/, AA-979 CRM-P2a, moved from AA-CIS-App with its history): "Portal Build" (npm ci, tsc, next
# build; meant to join the required checks) and "Portal Lint" (ESLint, non-required, like in AA-CIS-App). AA-979 P2b:
# "Portal Docker Build Check" (the Fargate image, container smoke, Trivy, SBOM; to join the required checks). The
# portal deploys from deploy-portal-dev.yml (Fargate) and, for the rollback window only, vercel-deploy-portal.yml.
#
# ARM: the API runs on Fargate ARM64 (ADR 0010 decision 2), so the image is built and smoke-tested on a native arm64
# runner (ubuntu-24.04-arm, free for public repositories); the Python jobs run on x64 (pure-Python code, the pinned
# wheels exist for both).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # AA-889 (merge queue): the queue tests each group on a temporary gh-readonly-queue/main/* commit and waits for
  # every required check there. All jobs run on it, with no path filter, so no required check is left unreported.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # pip-audit FAILS here (as in AA-Booking). The same job runs the DM-6.10 resource-ID check (this repo is public). The
  # gitleaks scan that ran here moved to .github/workflows/secret-scan.yml (AA-981 follow-up): check "gitleaks" on every
  # PR with the base branch's rules (.gitleaks.toml, .gitleaksignore), "gitleaks full history"
  # (secret-scan-history.yml) nightly and on push to main.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # DM-6.10 (D-25): no AWS account ID, ARN with an account, VPC/SG/subnet ID, Cognito pool ID or API Gateway host
      # in any tracked file. Stdlib only; byte copy of AA-Booking's script (AA-902).
      - name: No literal AWS resource IDs (failing)
        working-directory: .
        run: python3 .github/scripts/check_resource_ids.py

      - name: pip-audit (runtime + dev requirements, failing)
        run: |
          pip install pip-audit==2.10.1 --quiet
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      # AA-935: the CRM web's npm dependencies (runtime and dev), from the lockfile, failing on high or critical.
      - name: npm audit (web, failing on high)
        working-directory: web
        run: npm audit --audit-level=high

      # AA-979: the tenant portal's npm dependencies, from its lockfile, same rule as the web.
      - name: npm audit (portal, failing on high)
        working-directory: portal
        run: npm audit --audit-level=high

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Includes the route-class guard over every served path, the job payload guard (ids only), the DB access lint,
      # the import boundary, the deploy preflight script (stub aws/curl) and the vendored-copy checker.
      # AA-993 (P3): the Python 3.12 sys.monitoring coverage tracer, about 1.7x faster here with the same TOTAL.
      - name: Run unit tests
        env:
          ENVIRONMENT: test
          COVERAGE_CORE: sysmon
        run: pytest tests/unit -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=90

  # Applies api/migrations/*.sql in order to a real PostgreSQL 15 (the RDS major) as AA-CIS-Infra DB Migrate does:
  # logged in as aa_cis_admin (NOT superuser, the RDS master shape), each file as crm_owner (SET ROLE), after a role
  # bootstrap that mirrors Infra rl-003 / rl-004 (tests/integration/bootstrap_roles.py). Then: re-apply (idempotency),
  # the base-table catalogue guard, cross-tenant RLS, tenant_tx() as crm_app, crm.job against the ADR 0003a template,
  # lease re-claim of a stopped worker, /crm/health/ready as crm_app.
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only # gitleaks:allow (throwaway CI service container)
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # -rs lists skips; a skipped integration test would make this check green without testing anything.
      - name: Run integration tests (no skips allowed)
        env:
          ENVIRONMENT: test
          CRM_TEST_ADMIN_DSN: postgresql://aa_cis_admin:ci-only@localhost:5432/crm_ci # gitleaks:allow (CI-only)
        run: |
          set -o pipefail
          python -m tests.integration.bootstrap_roles "postgresql://postgres:ci-only@localhost:5432/crm_ci" # gitleaks:allow (CI-only)
          pytest tests/integration -v --tb=short -rs -p no:cacheprovider | tee /tmp/integration.txt
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/integration.txt; then
            echo "::error::integration tests were skipped"; exit 1
          fi

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The release version comes from the manifest at the repo root, like the Deploy Dev build.
      - name: Build image (linux/arm64, native)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' ../.release-please-manifest.json)" \
            --tag aa-crm-api:ci-${{ github.sha }} \
            .
          docker image inspect aa-crm-api:ci-${{ github.sha }} --format '{{.Architecture}}' | grep -qx arm64

      # The image must start and answer liveness without a database (ALB health check contract).
      - name: Container answers /crm/health without a database
        run: |
          set -euo pipefail
          docker run -d --name crm-ci -p 8000:8000 aa-crm-api:ci-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/crm/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          jq -e --arg sha "${{ github.sha }}" --arg ver "$(jq -r '."."' ../.release-please-manifest.json)" \
            '.status == "ok" and .service == "aa-crm-api" and .git_sha == $sha and .version == $ver' /tmp/health.json
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/crm/health/ready)
          cat /tmp/ready.json
          [ "$code" = "503" ] && jq -e '.db == "not_configured"' /tmp/ready.json
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/crm/v1/me)
          [ "$code" = "401" ]
          docker rm -f crm-ci

      # Blocking, like CIS and Booking: fails on any CRITICAL/HIGH finding that HAS a fix (`ignore-unfixed`). An
      # accepted fixable finding goes into .trivyignore with a `# reason` line and `exp:YYYY-MM-DD` at most 90 days
      # ahead (.github/scripts/check_trivyignore.py, byte copy of the AA-CIS-App script).
      - name: Trivy ignore entries carry a reason and an expiry
        working-directory: .
        run: python3 .github/scripts/check_trivyignore.py .trivyignore

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-crm-api:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: "aa-crm-api:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

  # Non-required: byte copies of AA-CIS-App files (api/tests/job_template/, api/app/auth/identity_verifier.py, the
  # web's and portal's lib/ BFF helpers). Fails when a copy drifts from CIS main. Stdlib only; the repos are public,
  # github.token only lifts the API rate limit. The UI kit is not here since AA-994 S2a (kit.lock.json checks).
  vendored-copies:
    name: Vendored CIS copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the vendored CIS files with AA-CIS-App main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_vendored_copies.py

  # AA-935 — the CRM web (Next.js standalone). Unit tests (vitest: dates/locale, session sealing, OAuth, host routing,
  # BFF allow-list, route handlers), then `next build` (it runs the TypeScript check), then the standalone server is
  # started with fake configuration and must answer /healthz, refuse an unknown Host and send a page without a
  # session to /auth/refresh. NODE_OPTIONS caps the build's heap like the Dockerfile does.
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # AA-994 S2a (root ADR 0016 decision 5) — the vendored UI kit core, before npm ci (dependency-free). Integrity:
      # every file of app/_kit/core has the sha256 of its MANIFEST.json, no file is missing or extra, the manifest is the
      # one kit.lock.json pins, and no CSS file outside core/tokens.css defines an --aa-* variable. Provenance: that
      # manifest is AA-CIS-App's at the lock's ref and the ref is on CIS main (reads GitHub only when this change
      # touches web/kit.lock.json or web/app/_kit/core; otherwise it passes at once).
      - name: Kit core integrity (check-kit-copy.mjs)
        run: |
          node app/_kit/core/check-kit-copy.mjs
          node app/_kit/core/check-kit-copy.mjs --css .

      - name: Kit core provenance (kit.lock.json ref on AA-CIS-App main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 ../api/scripts/check_kit_provenance.py kit.lock.json --base "$BASE_SHA"

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build (includes the type check)
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Standalone server smoke
        env:
          ENVIRONMENT: test
          PORT: "3005"
          HOSTNAME: 127.0.0.1
          WEB_PUBLIC_ORIGIN: http://localhost:3005
          WEB_PARTNER_HOSTS: localhost:3005
          CRM_API_ORIGIN: http://127.0.0.1:9
          COGNITO_DOMAIN: https://auth.example.test
          COGNITO_CLIENT_ID: ciclient
          COGNITO_CLIENT_SECRET: x
          WEB_SESSION_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3005/healthz -o /tmp/healthz.json && break; sleep 1; done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "$GIT_SHA" '.status == "ok" and .service == "aa-crm-web" and .git_sha == $sha and .auth_configured == true' /tmp/healthz.json
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.test' http://localhost:3005/)" = "404" ]
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3005/pipeline)
          echo "$loc" | grep -q '^http://localhost:3005/auth/refresh?next=%2Fpipeline$'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/bff/me)" = "401" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/signed-out)" = "200" ]
          curl -sI http://localhost:3005/signed-out | grep -qi "^content-security-policy: frame-ancestors 'none'"

  # AA-935 — the CRM web image: native arm64 (Fargate ARM64, ADR 0010 decision 2), container answers /healthz with its
  # commit, Trivy fails on fixable CRITICAL/HIGH like the API image.
  web-docker-build:
    name: Web Docker Build Check
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Build image (linux/arm64, native)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' .release-please-manifest.json)" \
            --tag aa-crm-web:ci-${{ github.sha }} \
            web
          docker image inspect aa-crm-web:ci-${{ github.sha }} --format '{{.Architecture}}' | grep -qx arm64

      - name: Container answers /healthz without any configuration
        run: |
          set -euo pipefail
          docker run -d --name crm-web-ci -p 3000:3000 aa-crm-web:ci-${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz -o /tmp/healthz.json && break; sleep 1; done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "${{ github.sha }}" '.status == "ok" and .git_sha == $sha and .auth_configured == false' /tmp/healthz.json
          [ "$(docker inspect --format '{{.Config.User}}' crm-web-ci)" = "10001" ]
          docker rm -f crm-web-ci

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-crm-web:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

  # AA-979 (CRM-P2b) — the Content studio image for Fargate (portal/Dockerfile: standalone + /portal-assets prefix):
  # native arm64 build, container smoke as the ALB and CloudFront will call it (health on any Host, the Host guard, the
  # asset prefix, redirects and the write guard on the PUBLIC origin, never the bind address: critic C2), Trivy, SBOM.
  portal-docker-build:
    name: Portal Docker Build Check
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Build image (linux/arm64, native)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' .release-please-manifest.json)" \
            --tag aa-crm-portal:ci-${{ github.sha }} \
            portal
          docker image inspect aa-crm-portal:ci-${{ github.sha }} --format '{{.Architecture}}' | grep -qx arm64

      - name: Container smoke (health, Host guard, asset prefix, public-origin redirects and write guard)
        run: |
          set -euo pipefail
          PUBLIC=https://portal.example.test
          docker run -d --name crm-portal-ci -p 3000:3000 \
            -e ENVIRONMENT=dev -e PORTAL_HOSTS=portal.example.test -e PORTAL_PUBLIC_ORIGIN="$PUBLIC" \
            -e WEB_SESSION_SECRET=ci-only-session-secret-not-real-0123456789 -e API_URL=http://127.0.0.1:9 \
            aa-crm-portal:ci-${{ github.sha }}
          H=(-H "Host: portal.example.test")
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz -o /tmp/healthz.json && break; sleep 1; done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "${{ github.sha }}" '.ok == true and .service == "aa-partner-portal" and .sha == $sha' /tmp/healthz.json
          [ "$(docker inspect --format '{{.Config.User}}' crm-portal-ci)" = "10001" ]
          # Host guard: any other Host is 404 (the health check above answered the task's own address).
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:3000/tenant-login)" = "404" ]
          # The API-key sign-in page (on during the P2b window) and its assets under /portal-assets/.
          [ "$(curl -s -o /tmp/login.html -w '%{http_code}' "${H[@]}" http://localhost:3000/tenant-login)" = "200" ]
          ASSET=$(grep -o '/portal-assets/_next/static/[^"]*\.js' /tmp/login.html | head -n1)
          [ -n "$ASSET" ] || { echo "::error::no /portal-assets/_next/static asset in the page"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "http://localhost:3000$ASSET")" = "200" ]
          # No session: the page gate sends the browser to the CRM web's refresh on the PUBLIC origin.
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' "${H[@]}" http://localhost:3000/portal/dashboard)
          [ "$LOC" = "$PUBLIC/auth/refresh?next=%2Fportal%2Fdashboard" ] || { echo "::error::redirect to '$LOC'"; exit 1; }
          # Write guard on the public origin: same origin passes (200), another origin is 403.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${H[@]}" -H "Origin: $PUBLIC" http://localhost:3000/api/auth/tenant-logout)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${H[@]}" -H 'Origin: https://evil.example' http://localhost:3000/api/auth/tenant-logout)" = "403" ]
          docker rm -f crm-portal-ci

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-crm-portal:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: "aa-crm-portal:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-portal-${{ github.sha }}.cdx.json
          artifact-name: sbom-portal-${{ github.sha }}.cdx.json

  # AA-979 (CRM-P2a) — the tenant portal (portal/, Next.js, Vercel project aa-cis-portal): type check and production
  # build. It builds without any secret or env var (the app reads its API URL at runtime). No local `next build` on the
  # agents' 7 GB machine: this job is the build check. NODE_OPTIONS caps the heap like the web build.
  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      # AA-994 S2a (root ADR 0016 decision 5) — the vendored UI kit core, before npm ci (dependency-free). Integrity:
      # every file of app/_kit/core has the sha256 of its MANIFEST.json, no file is missing or extra, the manifest is the
      # one kit.lock.json pins, and no CSS file outside core/tokens.css defines an --aa-* variable. Provenance: that
      # manifest is AA-CIS-App's at the lock's ref and the ref is on CIS main (reads GitHub only when this change
      # touches portal/kit.lock.json or portal/app/_kit/core; otherwise it passes at once).
      - name: Kit core integrity (check-kit-copy.mjs)
        run: |
          node app/_kit/core/check-kit-copy.mjs
          node app/_kit/core/check-kit-copy.mjs --css .

      - name: Kit core provenance (kit.lock.json ref on AA-CIS-App main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 ../api/scripts/check_kit_provenance.py kit.lock.json --base "$BASE_SHA"

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p .

      # AA-761 — the pure helpers under lib/ (node --test, no extra dependency; *.test.ts is outside tsconfig).
      - name: Unit tests (node --test)
        run: npm test

      - name: Build (next build)
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # AA-979 — ESLint for the portal. NON-required, as in AA-CIS-App (AA-885): the pre-existing errors came over with the
  # portal files. The summary line goes to the job summary.
  portal-lint:
    name: Portal Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Run ESLint (write summary to the job summary)
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"
          STATUS=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep -E "problems \(" "$RUNNER_TEMP/lint-output.txt" | tail -n1)
          {
            echo "### Portal ESLint"
            echo ""
            echo "${SUMMARY_LINE:-No summary line (lint produced no problems)}"
            echo ""
            echo "_Non-required job; the pre-existing errors came with the portal files (AA-885, AA-979)._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS
