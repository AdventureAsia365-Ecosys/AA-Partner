[project]
name = "aa-partner-api"
version = "0.5.0"
description = "AA-Partner API (partner CRM) — FastAPI + asyncpg on the shared acc2 RDS, schema crm"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 120
target-version = "py312"
# Byte copies of AA-CIS-App files (CIS style, never edited here; CI "Vendored CIS copies" checks them): the job table
# template comparator (shared/jobs/) and the multi-issuer verifier (api/core/identity_verifier.py).
extend-exclude = [
    "tests/job_template/job_table_shape.py",
    "app/auth/identity_verifier.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed CI-only credentials by design.
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL (CRM_TEST_ADMIN_DSN); skipped otherwise"]

[tool.coverage.run]
source = ["app"]
omit = ["app/auth/identity_verifier.py", "app/seed/__main__.py"]
